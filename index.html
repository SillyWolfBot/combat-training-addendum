ntrol","primary":"Lateral landing control followed by coordinated shuffle steps.","sport":"Boxing and kickboxing: forceful repositioning and controlled landings. Wrestling and judo: lower-body force production and recovery of a stable base.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"NSCA: plyometric training principles","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Reach Your Potential Training","url":"https://vimeo.com/149901107"}]}},"jumpCombo":{"id":"jumpCombo","title":"Broad jump → vertical jump → stick","url":"https://www.youtube.com/watch?v=msf9AbwZ1_s","provider":"Littauer Strength Training","detail":"Use a modest forward jump, absorb the landing and perform a low vertical jump, then hold the final landing. Reset fully between pairs.","gear":["floor","support"],"cue":"Each pair has two landings. Replaces the broad-jump slot, never added beside it. Return to a pause between jumps if needed.","rest":"60–90 sec","regression":"Shorter bilateral jump; use step-to-stick only as a symptom/return regression.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Shows broad-to-vertical jump combination. This is not the earlier straight broad jump followed by a separate 45-degree step-and-follow.","type":"exercise","why":"Forward force, braking and regaining a usable base.","alternative_links":[{"label":"Vertical landing reference","url":"https://vimeo.com/665273054"}],"verified_on":"2026-11-11","purpose":{"type":"Plyometric power / landing control","primary":"Forward-to-vertical force transition, repeated leg power and a stable final landing.","sport":"Boxing and kickboxing: forceful repositioning and controlled landings. Wrestling and judo: lower-body force production and recovery of a stable base.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"NSCA: plyometric training principles","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Littauer Strength Training","url":"https://www.youtube.com/watch?v=msf9AbwZ1_s"}]}},"plusBand":{"id":"plusBand","title":"Light-band serratus push-up plus","url":"https://vod.video.cornell.edu/media/Push%2BUp%2BPlus/1_46uhdpf5","provider":"Cornell Health","detail":"Use your comfortable floor or incline position with a light band secured across the upper back and under the hands. Perform the small scapular push-away motion.","gear":["band","bench"],"cue":"Change only band resistance at introduction; no extra depth or reduced support.","rest":"30–45 sec","regression":"Use the unbanded push-up plus at a higher comfortable incline or at the wall.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Demonstrates the base push-up-plus scapular action. Incline, added pause and later band resistance are separate card modifications; the banded version is not fully shown.","type":"exercise","why":"Shoulder-blade support for weight-bearing and force transfer without another full push-up workout.","verified_on":"2026-11-11","purpose":{"type":"Shoulder capacity / rehab-support strength","primary":"Serratus anterior strength against added resistance during scapular push-away.","personal":"Develops serratus and shoulder-blade support around your shoulder-strengthening work.","sport":"Boxing and kickboxing: controlled scapular reaching. Wrestling and BJJ: shoulder support while bearing weight through the hands.","references":[{"label":"Exercise demonstration: Cornell Health","url":"https://vod.video.cornell.edu/media/Push%2BUp%2BPlus/1_46uhdpf5"}]}},"pushPair":{"id":"pushPair","title":"Two linked push-up pops","url":"https://www.youtube.com/watch?v=INfoyOtxiBU","provider":"Dr. Jacob Goodin · YouTube","detail":"Perform two crisp low-amplitude push-up pops at the familiar support height, receiving softly. Reset and rest between pairs.","gear":["bench","floor"],"cue":"No clap, depth drop or forced hand flight. If the second rep loses control, use two separated repetitions.","rest":"90–120 sec or until quality returns","regression":"Use a higher secure surface and a brisk incline push-up without hand lift-off, or omit this power slot while retaining Mike’s comfortable main pressing work.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Brief upper-body power practice before fatigue. Not another pressing circuit.","purpose":{"type":"Plyometric power / landing control","primary":"Repeatable upper-body pushing power across two linked repetitions.","sport":"Boxing and Muay Thai/kickboxing: upper-body rate of force production. Wrestling and BJJ: rapid pushing and hand-support capacity.","bone":"Upper-body resistance supplies a mechanical loading stimulus to the arm and shoulder-girdle bones.","references":[{"label":"NSCA: plyometric training principles","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Dr. Jacob Goodin · YouTube","url":"https://www.youtube.com/watch?v=INfoyOtxiBU"}]}},"footwork":{"id":"footwork","title":"Athletic step-and-reset","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU","provider":"University of Denver Sports Performance","detail":"On a clear floor, take small planned steps forward, backward and sideways, returning to a comfortable balanced stance after each direction. No punches, kicks or club-specific entries.","gear":["floor"],"cue":"No planted-foot pivots or technique drills. Keep the whole session self-directed.","rest":"45–60 sec","regression":"Shorter, slower shuffles or the last comfortable footwork drill.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"General foot placement, braking and stance repeatability shared across striking and grappling demands.","purpose":{"type":"Athletic coordination / movement skill","primary":"Controlled foot placement, balance and stance recovery in several directions.","sport":"Boxing and Muay Thai/kickboxing: controlled movement into and out of position. Wrestling and judo: changing the base and responding to direction cues.","references":[{"label":"Exercise demonstration: University of Denver Sports Performance","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU"}]}},"cueShuffle":{"id":"cueShuffle","title":"Solo cue-based lateral shuffle","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU","provider":"University of Denver Sports Performance","detail":"Use the file’s random left/right cue or a self-set timer. Shuffle a short distance, stop under control and reset for the next cue.","gear":["floor"],"cue":"The decision changes, not the speed. No partner is required. Keep cues slow enough to stop cleanly.","rest":"45–60 sec","regression":"Shorter, slower shuffles or the last comfortable footwork drill.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Lateral movement and braking while retaining balance. Supports general change-of-direction capacity.","cueMode":"lr","purpose":{"type":"Athletic coordination / movement skill","primary":"Lateral footwork, braking and response to a changing directional cue.","sport":"Boxing and Muay Thai/kickboxing: controlled movement into and out of position. Wrestling and judo: changing the base and responding to direction cues.","references":[{"label":"Exercise demonstration: University of Denver Sports Performance","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU"}]}},"cueSteps":{"id":"cueSteps","title":"Solo cue-based multidirectional steps","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU","provider":"University of Denver Sports Performance","detail":"Use the file’s forward/back/left/right cue. Take short controlled steps and reset before the next cue.","gear":["floor"],"cue":"General movement only; no strikes, takedowns or throwing entries. Keep all turns step-based.","rest":"45–60 sec","regression":"Shorter, slower shuffles or the last comfortable footwork drill.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"General foot placement, braking and stance repeatability shared across striking and grappling demands.","cueMode":"four","purpose":{"type":"Athletic coordination / movement skill","primary":"Multidirectional foot placement and controlled responses to external cues.","sport":"Boxing and Muay Thai/kickboxing: controlled movement into and out of position. Wrestling and judo: changing the base and responding to direction cues.","references":[{"label":"Exercise demonstration: University of Denver Sports Performance","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU"}]}},"balanceLoad":{"id":"balanceLoad","title":"Single-leg balance · light opposite-hand hold","url":"https://www.youtube.com/watch?v=XIzzy_BTkVE","provider":"Travis Tarrant","detail":"Stand beside support on one foot while holding a light dumbbell in the opposite hand. Keep pelvis level and the foot tripod steady. No head turns in this version.","gear":["wall","lightdb","support"],"cue":"This is a control drill, not a heavy suitcase hold. Use a small load and short holds.","rest":"20–30 sec","regression":"Use both feet or hold a steady single-leg stance without head turns.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Standing balance with a small sensory challenge; firm floor and support nearby.","purpose":{"type":"Hip capacity / balance / general strength","primary":"Single-leg balance and pelvic stability against a light opposite-hand load.","personal":"Develops single-leg balance and coordination of the foot, hip and pelvis.","sport":"Muay Thai/kickboxing: steadier supporting-leg balance. Boxing, wrestling and judo: control while shifting weight.","references":[{"label":"Exercise demonstration: Travis Tarrant","url":"https://www.youtube.com/watch?v=XIzzy_BTkVE"}]}},"stepReach":{"id":"stepReach","title":"Three-direction reach · controlled return","url":"https://www.youtube.com/watch?v=8qbYiiNyoNg","provider":"Peak Physio","detail":"With fingertip support available, reach the free foot forward, diagonally and sideways. Return to still single-leg balance before each next reach.","gear":["wall","support"],"cue":"Choose range you can control without twisting. More distance is not compulsory.","rest":"20–30 sec","regression":"Use fingertip support and shorter reaches.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Rehab-support / local strength and control","primary":"Single-leg coordination and control when reaching and returning to a still stance.","personal":"Develops active arch support and control of foot pressure during weight transfer.","sport":"Boxing and Muay Thai/kickboxing: a stable foot base for stance changes. Wrestling and judo: controlled weight transfer while standing.","references":[{"label":"Exercise demonstration: Peak Physio","url":"https://www.youtube.com/watch?v=8qbYiiNyoNg"}]},"why":"Ankle and intrinsic-foot force, arch control or position sense, depending on the specific drill."},"ballPress":{"id":"ballPress","title":"Stability-ball dead bug · longer leg lever","url":"https://www.youtube.com/watch?v=QOKgBqNMAUY","provider":"Physical Therapy First","detail":"Maintain opposite-hand/knee pressure on the ball while extending the moving leg a little straighter. Keep the same comfortable arm reach and breathing.","gear":["stability","mat"],"cue":"Increase leg reach only, not arm reach, resistance and repetitions together.","regression":"Shorter limb reach or one foot supported.","rest":"45–60 sec","why":"Trunk control while opposite limbs maintain pressure and other limbs move.","type":"exercise","form_note":"Demonstrates dead bug with stability-ball pressure. A longer leg lever is a later modification; keep the back comfortable and follow this card’s dose.","progression":"Complete repeatable, comfortable exposures before changing one variable. Maintain the easier version when control or next-morning tolerance deteriorates.","verified_on":"2026-11-11","purpose":{"type":"Trunk strength / isometric control","primary":"Trunk control against a longer moving-leg lever while maintaining opposite hand/knee pressure.","personal":"Builds control of trunk extension as the limbs move farther from the body.","sport":"Wrestling and BJJ: trunk support during reaching and ground movement. Boxing and kickboxing: bracing while the arms and legs move independently.","references":[{"label":"Exercise demonstration: Physical Therapy First","url":"https://www.youtube.com/watch?v=QOKgBqNMAUY"}]}},"wristHold":{"id":"wristHold","title":"Wrist extension · repetitions + hold","url":"https://vimeo.com/861439409","provider":"E3 Rehab","detail":"Perform the controlled wrist-extension repetitions, then hold a comfortable raised-wrist position against the light dumbbell for the prescribed time.","gear":["seat","lightdb"],"cue":"The hold replaces a moving set rather than becoming an extra maximal-grip exercise.","rest":"30–45 sec","regression":"Use no added weight or shorter comfortable range.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Wrist-extensor capacity complements the gripping and carrying elsewhere.","purpose":{"type":"Local strength / grip-support capacity","primary":"Wrist-extensor strength through repetitions followed by sustained force in a held position.","personal":"Builds forearm and wrist capacity alongside the gripping and carrying already in your programme.","sport":"Judo, wrestling and BJJ: wrist positioning and forearm control during gripping and hand fighting.","references":[{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/861439409"}]}},"ropeBasic":{"id":"ropeBasic","title":"Jump rope · basic bounce","url":"https://www.youtube.com/watch?v=TxFeUcIPUHs","provider":"Crossrope","detail":"Use tiny two-foot bounces and relaxed wrists. Keep the same easy rhythm across short bouts.","gear":["rope","floor","support"],"cue":"No rabbits or extra pogos after this rope slot. Rope seconds are separate from larger-jump landing counts.","rest":"40–60 sec walking between intervals","regression":"Use the bike-only track if landing or toe push-off hurts.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Basic jump-rope bounce demonstration. Follow the short bouts on this card, not a full workout or higher-impact trick sequence.","type":"exercise","verified_on":"2026-11-11","purpose":{"type":"Coordination / repeated-contact conditioning","primary":"Rope timing, low two-foot jumping and repeated calf work.","sport":"Boxing and Muay Thai/kickboxing: rhythm, repeated foot contacts and coordination of alternating weight transfer.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"Chottidao et al.: jump-rope and plyometric training in boxers","url":"https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2022.878527/full"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Crossrope","url":"https://www.youtube.com/watch?v=TxFeUcIPUHs"}]},"why":"Low-amplitude repeated contacts, rope timing, rhythm and eventually repeatable boxer-step bouts."},"ropeAlt":{"id":"ropeAlt","title":"Jump rope · alternating-foot practice","url":"https://www.youtube.com/watch?v=s_nuLdHYmBY","provider":"Crossrope","detail":"Start with the familiar basic bounce, insert a few short alternating-foot segments, then return to the familiar bounce before coordination fails.","gear":["rope","floor","support"],"cue":"Brief alternating segments, not sustained single-leg hopping. Keep height low.","rest":"40–60 sec walking between intervals","regression":"Use the bike-only track if landing or toe push-off hurts.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Alternating-foot rope demonstration. Use brief learning segments inside the prescribed bout.","type":"exercise","verified_on":"2026-11-11","purpose":{"type":"Coordination / repeated-contact conditioning","primary":"Alternating-foot coordination and repeatable rope clearance during weight transfer.","sport":"Boxing and Muay Thai/kickboxing: rhythm, repeated foot contacts and coordination of alternating weight transfer.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"Chottidao et al.: jump-rope and plyometric training in boxers","url":"https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2022.878527/full"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Crossrope","url":"https://www.youtube.com/watch?v=s_nuLdHYmBY"}]},"why":"Low-amplitude repeated contacts, rope timing, rhythm and eventually repeatable boxer-step bouts."},"ropeBox":{"id":"ropeBox","title":"Jump rope · boxer-s ://www.youtube.com/watch?v=BJDy1FkNjho","provider":"Steph Gaudreau","detail":"Pick up the handled bag from a raised stable support, using the handles. Hug the bag body close to your torso and stand with both feet planted. Breathe steadily while keeping ribs stacked over the pelvis. Lower gently.","gear":["bag","floor"],"cue":"A stationary front-loaded hold, distinct from Sunday’s walking carry. No leaning back, breath-holding, maximal squeezing or dropping. This is a small new add-on, not a new heavy session.","rest":"60–90 sec","regression":"Use a lighter bag, a raised pickup or a short stationary bag hold. The medicine ball has its own separate adductor-squeeze role.","progression":"First own 20 seconds at a manageable load. Progress load or holding time, not both. Marching is a separate small skill addition, not a reason to overload this hold.","form_note":"Demonstrates a sandbag bear-hug carry. Stationary holds, alternating marches and wide turns are specified on their cards and are not claimed to be an exact full-video match.","type":"exercise","why":"Sustain front-loaded trunk and upper-back force while breathing. A general physical foundation for holding posture under close-contact resistance, not a simulated throw.","verified_on":"2026-11-11","purpose":{"type":"Loaded posture / isometric strength / grip","primary":"Isometric trunk and upper-back endurance while supporting a bag in front of the body.","personal":"Develops sustained trunk and upper-back support under a front-held load.","sport":"Wrestling, judo and BJJ: posture while holding close-contact resistance. Muay Thai: general holding endurance for clinch preparation.","references":[{"label":"NSCA: loaded carries and trunk/hip stability","url":"https://www.nsca.com/education/articles/nsca-coach/increase-hip-and-trunk-stability-with-loaded-carries/"},{"label":"Exercise demonstration: Steph Gaudreau","url":"https://www.youtube.com/watch?v=BJDy1FkNjho"}]}},"stepdownLoad":{"id":"stepdownLoad","title":"Supported lateral step-down · light held load","url":"https://vimeo.com/647952200","provider":"E3 Rehab","detail":"Use the same low flat step and hand support. Hold a light dumbbell in the free hand. Lower the opposite heel toward the floor for three seconds, lightly touch and return without pushing from the tapping foot.","gear":["step","wall","lightdb","support"],"cue":"Do not increase step height and load together. Begin only after repeatable pain-free unloaded step-downs. Sharp knee jabs or altered foot loading stop this task.","rest":"45–60 sec between sets","regression":"Use a lower step, a smaller lowering range and more hand support. Skip it if sharp pain occurs rather than testing repeatedly.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The video shows the lateral step-down base movement. The hand support, three-second lowering and light external load are written additions, not all demonstrated together.","type":"exercise","purpose":{"type":"Hip capacity / balance / general strength","primary":"Loaded quadriceps strength and hip/knee control during slow single-leg lowering.","personal":"Develops quadriceps strength and hip/knee control during single-leg lowering.","sport":"Boxing and kickboxing: control while lowering and shifting the stance. Wrestling and judo: receiving-leg control and strength.","bone":"Loaded muscle contractions and weight-bearing supply a strengthening stimulus to the bones of the legs and hips.","references":[{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/647952200"}]},"why":"Hip abductor/rotator control and pelvic stability during single-leg support or lateral movement."},"rackHold":{"id":"rackHold","title":"Single-a than adding another carry type.","dose":"3 × 25 m per side · same heavier load; final set 5-sec hold"},{"day":"Friday","key":"inv","why":"Maintain the prescribed effort with the next band only after repeated comfortable sessions.","dose":"2 × 8–10 + 1 × 20-sec hold per side · established or next tolerated band"},{"day":"Sunday","key":"crawl","why":"Repeat a clear general ground-to-standing sequence, not a martial-arts drill.","dose":"2 sequences per side: 4 m crawl → supported rise → 3 balanced steps"},{"day":"Tuesday","key":"pallof","why":"Hold the trunk against resistance while deliberately repositioning the feet.","ex":"pallofStep","dose":"2 × 5 step-out-and-return repetitions per resistance direction"},{"day":"Tuesday","key":"side","why":"Sustain the advanced lateral-support task slightly longer.","dose":"2 × 20 sec per side · top leg raised"},{"day":"Wednesday","key":"balance","why":"Keep hip control with one set; use a short equipment-based anti-rotation hold for the other slot.","ex":"hipAir","dose":"1 × 4 per side · support available"},{"day":"Wednesday","key":"pallofControl","why":"Adds an easy self-directed external-resistance control task, not a hard post-Tuesday core session.","insert":{"key":"pallofControl","ex":"pallof","dose":"1 × 4 per direction · light band; 3-sec hold","reduced":"1 × 3 per direction · light band","slot":"SOLO CONTROL · LIGHT","change":"Adds an easy self-directed external-resistance control task, not a hard post-Tuesday core session.","lastChanged":13}},{"day":"Monday","key":"neck","ex":"neck","dose":"2 × 15 sec in EACH of four directions · next earned small tension increase, about 3–4/10 effort","why":"Build neutral-head holding time at unchanged band tension."},{"day":"Wednesday","key":"neck","ex":"neck","dose":"1 × 10 sec in EACH of four directions · easy band, about 2/10 effort","why":"Easy band practice; keep tension lighter than Monday/Thursday because Thursday follows the next day."},{"day":"Thursday","key":"neck","ex":"neck" ck","dose":"2 × 15 sec in EACH of four directions · one earned small tension increase, about 3–4/10 effort","why":"Use one easier round for deload/review; keep the familiar band."}],"26":[{"day":"Monday","key":"neck","ex":"neck","dose":"2 × 10 sec in EACH of four directions · baseline light tension, about 3–4/10 effort","why":"Keep the established neck dose during travel re-entry."},{"day":"Wednesday","key":"neck","ex":"neck","dose":"1 × 8 sec in EACH of four directions · easy band, about 2/10 effort","why":"Easy band practice; keep tension lighter than Monday/Thursday because Thursday follows the next day."},{"day":"Thursday","key":"neck","ex":"neck","dose":"2 × 10 sec in EACH of four directions · baseline light tension, about 3–4/10 effort","why":"Keep the established neck dose during travel re-entry."}],"27":[{"day":"Monday","key":"neck","ex":"neck","dose":"2 × 10 sec in EACH of four directions · one earned small tension increase, about 3–4/10 effort","why":"Keep the established neck dose during travel re-entry."},{"day":"Wednesday","key":"neck","ex":"neck","dose":"1 × 8 sec in EACH of four directions · easy band, about 2/10 effort","why":"Easy band practice; keep tension lighter than Monday/Thursday because Thursday follows the next day."},{"day":"Thursday","key":"neck","ex":"neck","dose":"2 × 10 sec in EACH of four directions · one earned small tension increase, about 3–4/10 effort","why":"Keep the established neck dose during travel re-entry."}],"32":[{"day":"Monday","key":"neck","ex":"neck","dose":"2 × 20 sec in EACH of four directions · one earned small tension increase, about 3–4/10 effort","why":"Use one easier round for deload/review; keep the familiar band."},{"day":"Wednesday","key":"neck","ex":"neck","dose":"1 × 10 sec in EACH of four directions · easy band, about 2/10 effort","why":"Easy band practice; keep tension lighter than Monday/Thursday because Thursday follows the next day."},{"day":"Thursday","key":"neck","ex":"neck","dose":"2 × 20 sec in EACH of four directions · one earned small tension increase, about 3–4/10 effort","why":"Use one easier round for deload/review; keep the familiar band."}],"36":[{"day":"Monday","key":"neck","ex":"neck","dose":"2 × 15 sec in EACH of four directions · next earned small tension increase, about 3–4/10 effort","why":"Use one easier round for deload/review; keep the familiar band."},{"day":"Wednesday","key":"neck","ex":"neck","dose":"1 × 10 sec in EACH of four directions · easy band, about 2/10 effort","why":"Easy band practice; keep tension lighter than Monday/Thursday because Thursday follows the next day."},{"day":"Thursday","key":"neck","ex":"neck","dose":"2 × 15 sec in EACH of four directions · next earned small tension increase, about 3–4/10 effort","why":"Use one easier round for deload/review; keep the familiar band."}]},"main":{"Friday":{"title":"TrainWell Gym Day 1","detail":"Keep Mike’s complete Gym Day 1: standing calf, quad and tibialis stretches, triceps stretch and chest opener; barbell squat 3 × 6 at reported 70 lb; dumbbell RDL 3 × 12 at reported 35 lb; one-arm bench rows 3 × 12 per arm at reported 35 lb; alternating lateral/front raise 8 reps at 15 lb; dumbbell face pull 10 reps at 15 lb; side-plank row 3 × 10 per side at 5–10 lb; half-kneeling cable rotation 10 reps at 20 lb; power step-up 3 × 10; three sets of box jumps; Mike’s complete cooldown. Sets not supplied here remain as prescribed in TrainWell.","cue":"Nothing in this companion removes, relocates or replaces these exercises. No extra Friday plyometrics. New companion work still adds load: use the readiness gate and ask Mike to review combined volume, especially the jump repetitions."},"Tuesday":{"title":"TrainWell Gym Day 2","detail":"Keep Mike’s full Gym Day 2, including barbell bench press AND dumbbell Arnold press; one-arm row, wide lat pulldown, wide bent-over row; single-leg calf raise and tibialis raise; trunk rotation; kettlebell farmer, waiter and suitcase carries; all warm-up and cooldown exercises. The companion kettlebell strict press is ADDITIONAL, not a replacement for Arnold press.","cue":"Arnold press and kettlebell strict press both remain, and their shared shoulder/triceps load counts. Sunday explosive push-ups stay Sunday. Tuesday suitcase work is done once in the existing TrainWell carry block, not repeated by this file."},"Sunday":{"title":"TrainWell Sunday · complete original circuit","detail":"Keep the full original circuit: single-kettlebell goblet squat, held medicine-ball Russian twist, bodyweight split squat, wall sit, BOSU plank, plyo rabbit, jump squat and explosive push-up, plus the complete warm-up and cooldown. Use Mike’s actual doses. Every companion card is additional unless explicitly marked as an existing TrainWell reference.","cue":"No stations are replaced or moved. All app jumps, rabbits, explosive push-ups and core work count toward the combined session. Do not assume the entire combined impact volume is cleared: confirm the actual jump counts with Mike before adding or progressing impact. Jogging and rope remain planned companion strands."},"Monday":{"title":"TrainWell back programme + bike","detail":"Keep your stated Monday rehabilitation/strength work and cycling. The TRX knee-flexion work, ball squeeze, modest foot hold and gentle neck work are the companion additions.","cue":"Keep all main back work and cycling. Companion hamstrings, ball/ankle/neck work and flat walking are additional submaximal work. Do not turn this into another hard back session."},"Wednesday":{"title":"TrainWell recovery + 30-minute row","detail":"Keep your mobility/recovery routine and the 30-minute row. The following foot, hip and solo control tasks stay short and easy enough to preserve recovery.","cue":"Keep all TrainWell mobility, single-leg calf raises and the 30-minute row. The low-dose heel cue and foot-control tasks are additional, not replacements. Add the planned flat walk without a step-count target."},"Thursday":{"title":"TrainWell back programme + bike","detail":"Keep the Thursday back routine and bike. Use the short active-hip, wrist/forearm, light dorsiflexion and gentle neck work below.","cue":"Keep all TrainWell back, bike and stretching work. Companion hip/wrist/ankle/neck work and the flat walk are additional. A couch stretch never replaces a prescribed stretch or requires forced range."}},"coverage":[{"region":"Foot, medial ankle and arch","main":"Tuesday calf/tibialis raises, walking and all gym work already contribute load.","companion":"Friday dynamic inversion/eversion and soleus work plus selected holds; modest Monday inversion hold; Wednesday arch/balance/heel-control work; light Thursday dorsiflexion hold; separate Sunday impact progression.","progress":"Resistance and unilateral support progress on strength days. Control days stay modest. Rope and larger jumps are tracked separately.","boundary":"Tibialis anterior and posterior are different structures. Persistent pinpoint navicular pain, swelling, altered walking or worsening next mornings require assessment; no diagnosis is made here."},{"region":"Hips and adductors","main":"Squats, RDLs and split squats remain the main lifting work.","companion":"Loaded lateral lunge, paused supported hinge, dynamic Copenhagen plus hold, hip wall press, band walks and active hip rotation.","progress":"Load, lever, assistance and movement linkage change separately; more instability is not automatically better.","boundary":"No forced knee rotation or weighted wall-bar side bends. Longer-lever Copenhagen is optional until comfortable."},{"region":"Trunk and ground support","main":"TrainWell side-plank rows, trunk rotation, plank variations and carries already count.","companion":"Tuesday side plank AND ab wheel; split-stance Pallof then marching/stepping; Sunday ball dead bug, crawling and later controlled pull-through/standing sequences.","progress":"Longer reach, asymmetric limb movement and stable load transfer replace simpler versions within the same slots.","boundary":"TrainWell core stations are retained. Companion crawling, dead bugs, planks and rollouts are additional load; use reduced settings and review recoverability rather than push through radiating symptoms."},{"region":"Shoulders, neck and grip","main":"TrainWell bench, Arnold press, pulling, and farmer/waiter/suitcase work stay. Sunday explosive push-ups remain Sunday.","companion":"Additional strict press, cuff and scapular capacity work, side plank plus ab wheel, brief front-rack hold and controlled Pallof work. Neck isometrics remain Monday and Thursday. Neck: four-way band holds on Monday and Thursday; one lighter round on Wednesday.","progress":"Measured resistance or leverage, not forced shoulder angles. Neck duration progresses gently, without scheduled heavy band or harness work. Neck holds build from 10 to 20 seconds before a small earned tension increase resets the duration.","boundary":"These share loading with the main programme even when their names differ. No automatic heavy-band neck work, depth push-ups or forced painful pressing. Later clean/push-press drills are optional coach-checked skill additions, not replacements."},{"region":"Sport relevance","main":"Strength, aerobic work and actual sport practice have different roles.","companion":"Calf/foot support, lateral force, braking, trunk stiffness, front-loaded handling, shoulder support and repeatable rope rhythm support the physical demands shared by boxing, kickboxing/Muay Thai, wrestling, judo and jiu-jitsu.","progress":"The plan trains physical qualities. It does not assign judo entries, wrestling level changes, hip escapes or technical stand-ups.","boundary":"Transfer to performance is a rationale, not proof that a drill teaches fighting skill or makes contact safe."},{"region":"Recovery and travel","main":"Saturday stays rest; Monday/Wednesday/Thursday remain controlled accessory days.","companion":"Both travel blackouts, a modest return overlay, three deloads and final review are retained.","progress":"Dates mark targets. The normal plan is a preview until the new demand is tolerated; repeat a prior level when needed.","boundary":"Existing cardio plus the three flat walks count toward total activity. Increasing sport classes calls for an explicit workload review, not silently deleting main exercises or assuming unlimited additions are recoverable."},{"region":"Equipment restrictions","main":"Barbells, dumbbells, cables and current machines stay in Mike’s programme.","companion":"Handled bag: controlled lifting/carrying only. Padded medicine ball: adductor squeeze when its size fits. Stability ball: dead-bug pressure/rollout alternative. TRX: hamstring work. Ab wheel: kneeling reach. Wall bars: secure support, not loaded stretching tricks.","progress":"Use equipment for the demand it supplies, not to use everything every day.","boundary":"No throws, slams or drops with either the bag or padded ball. No hard ball underneath painful navicular, sesamoid or arch areas."},{"region":"Cardiometabolic health and bone loading","main":"Cycling, rowing, jogging, walking and resistance training all contribute to the overall activity pattern; individual rehab drills are not LDL treatments.","companion":"15–20-minute flat walks on Monday, Wednesday and Thursday; Sunday run/walk and rope are retained. Weight-bearing and resistance tasks supply different types of loading.","progress":"Build aerobic consistency and measurable strength. Bone response is site-specific and depends on training dose, recovery and other factors; no guaranteed density change is assigned to a card.","boundary":"The DEXA body-composition result is not a local bone-injury assessment. Genetic interpretations do not clear an exercise or determine its weekly dose."}],"sources":[{"title":"ACSM 2026 resistance-training position stand","url":"https://pubmed.ncbi.nlm.nih.gov/41843416/","kind":"Position stand / evidence synthesis","use":"Supports goal-specific strength and power training in healthy adults. It does not validate the doses or injury clearance of this individual companion."},{"title":"NSCA: Plyometric Exercises","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/","kind":"Professional strength-and-conditioning guidance","use":"Supports short high-quality sets and accounting for jumping elsewhere. Existing Friday jumps and the Sunday athletic block are counted as one combined workload."},{"title":"Kostikiadis et al. 2018: strength and conditioning in MMA","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6090403/","kind":"Small intervention study in experienced MMA athletes","use":"Supports combining strength, power and aerobic qualities. A small trained-athlete trial does not justify copying elite workloads or guarantee fighting skill."},{"title":"Breda et al. 2021: progressive tendon-loading exercise","url":"https://pubmed.ncbi.nlm.nih.gov/33219115/","kind":"Randomized trial in diagnosed patellar tendinopathy","use":"Supports staged loading, progressing toward energy-storage demands. It does not diagnose your lateral-knee pain; massage is not the loading intervention."},{"title":"Beyer et al. 2015: heavy slow resistance and Achilles tendinopathy","url":"https://pubmed.ncbi.nlm.nih.gov/26018970/","kind":"Randomized trial in chronic midportion Achilles tendinopathy","use":"Supports sustained progressive loading as one option in that condition. The calf prescriptions here are general capacity work, not a claim that you have Achilles tendinopathy."},{"title":"Harøy et al. 2019: adductor strengthening","url":"https://pubmed.ncbi.nlm.nih.gov/29891614/","kind":"Cluster randomized trial in male football players","use":"Supports a progressive Copenhagen-based approach in that population. Carryover to grappling is a programming inference, not a guaranteed prevention effect."},{"title":"Chottidao et al. 2022: jump-rope / plyometric training in boxers","url":"https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2022.878527/full","kind":"Small boxing training study","use":"Provides sport-relevant context for rope and plyometric training. Our precise intervals are conservative design choices, not a reproduced or proven optimal protocol."},{"title":"CSCCa / NSCA return-to-training transition guidance","url":"https://www.nsca.com/about-us/position-statements/safe-return-to-training/","kind":"Professional consensus","use":"Supports a reduced transition after inactivity. The travel-return overlay is a conservative implementation, not a personalized clearance test."},{"title":"PAASS ankle return-to-sport framework","url":"https://pubmed.ncbi.nlm.nih.gov/34158354/","kind":"Expert consensus","use":"Pain, capacity, confidence, control and performance matter alongside elapsed time. The app does not substitute for an examination."},{"title":"Aletha official safety information","url":"https://alethahealth.com/pages/safety-terms-of-use","kind":"Manufacturer instructions, not independent effectiveness evidence","use":"Use only described placements under appropriate clinical guidance. Hip Hook, Range and Orbit are optional comfort tools; the manufacturer does not establish them as tendon-strengthening interventions."},{"title":"AAOS: sesamoiditis and sesamoid fracture","url":"https://www.orthoinfo.org/diseases--conditions/sesamoiditis/","kind":"Orthopaedic patient guidance","use":"Supports modifying painful forefoot loading. This matters for rope, running and toes-loaded crawling."},{"title":"NHS: Knee pain","url":"https://www.nhs.uk/symptoms/knee-pain/","kind":"Patient safety guidance","use":"Recurrent severe jabs or locking/giving-way are not a normal progression signal; urgent advice for inability to bear weight, marked swelling or a hot/red knee with fever."},{"title":"Life Fitness: Core Bags","url":"https://www.lifefitness.com/en-us/catalog/accessories/functional-training-accessories/core-bags","kind":"Manufacturer equipment informati function nextChange(w,d,key){for(let i=w+1;i<=24;i++){const x=DATA.plans[String(i)][d].find(x=>x.key===key&&x.newThisWeek);if(x)return{week:i,change:x.change};}return null;}
function previous(){if(state.idx>0){state.idx--;render();}}
function next(){const pos=viewPosition();if(pos.kind==='before'){state.week=1;state.day='Friday';state.idx=0;state.viewDate=null;render();return;}if(pos.kind!=='training')return;const a=current();if(state.idx<a.length-1){state.idx++;render();return;}state.progress[dayKey()]=true;save();openSheet('Session complete','<p>Record the work you actually completed and the next-morning response. Completing cards records navigation, not readiness for the next level.</p><div class="row-buttons"><button class="small-btn" onclick="advanceDay()">Next scheduled day</button><button class="small-btn" onclick="showLog()">Session note</button><button class="small-btn" onclick="showRope()">Rope log</button></div>');}
function advanceDay(){closeSheet();let i=(state.week-1)*7+DAYS.indexOf(state.day)+1;if(i>=168){showCalendar();return;}state.week=Math.floor(i/7)+1;state.day=DAYS[i%7];state.idx=0;state.viewDate=dateISO(state.week,state.day);render();}
let lastFocus=null;
function openSheet(title,body){stopCue();lastFocus=document.activeElement;$('sheet').innerHTML=`<div class="sheet-closebar"><button type="button" class="large-close" onclick="closeSheet()" aria-label="Close this panel">✕ Close panel</button></div><h2 id="sheetHeading">${esc(title)}</h2>${body}<button type="button" class="close" onclick="closeSheet()">Close panel · return to exercise</button>`;$('overlay').classList.add('open');document.body.style.overflow='hidden';$('sheet').scrollTop=0;$('sheet').querySelector('button')?.focus();}
function closeSheet(){stopCue();$('whyBtn').setAttribute('aria-expanded','false');$('overlay').classList.remove('open');document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus();}
function jumpTo(i){state.idx=i;closeSheet();render();window.scrollTo({top:0,behavior:'smooth'});}
function showOverview(){const a=current(),p=viewPosition(),gear=[...new Set(a.filter(x=>x.type==='exercise').flatMap(x=>x.gear||[]))];openSheet(p.kind==='training'?`${state.day} · overall Week ${state.week+12}`:'Schedule',`<p>${esc(fmt(p.date))}</p><div class="note-box"><strong>Equipment on these cards</strong><br>${gear.length?gear.map(x=>esc(EQUIP[x]||x)).join('; '):'None'}<br><small>Main TrainWell equipment is additional. TrainWell is retained. Existing-reference cards record main work once; other cards are additional.</small></div><ol class="day-list">${a.map((x,i)=>`<li><span class="num">${i+1}</span><button onclick="jumpTo(${i})"><strong>${esc(x.title)}</strong><small>${esc(x.slot)} · ${esc(x.dose)}</small>${x.newThisWeek?'<small>New demand this week</small>':''}</button></li>`).join('')}</ol>`);}

function showNeckProgression(){openSheet('Banded neck progression',`<p><b>Monday and Thursday:</b> two rounds of front, back, left and right holds. <b>Wednesday:</b> one easier round.</p><p>Baseline means a light, repeatable setup around 3/10 effort. Record band, anchor height and standing distance. First earn two comfortable 20-second sessions and an unchanged next morning; then use a small tension increase and reset to ten seconds. Have the setup checked before advancing resistance. Wednesday remains around 2/10 effort. Travel, reduced-load and deload settings still apply.</p><div class="table-scroll"><table><thead><tr><th>New / overall week</th><th>Monday + Thursday</th><th>Wednesday</th><th>Progression</th></tr></thead><tbody>${DATA.neckProgression.map(n=>`<tr><td>${n.week} / ${n.overall}</td><td>2 × ${n.mainSeconds} sec/direction<br>${esc(n.bandLabel)}</td><td>1 × ${n.wednesdaySeconds} sec/direction<br>Easy band tension</td><td>${esc(n.focus)}</td></tr>`).join('')}</tbody></table></div>`);}

function showPurpose(){const x=current()[state.idx],p=x.purpose;if(!p)return;const sections=[['What this exercise develops',p.primary],['Your structural / rehab-support focus',p.personal],['Sport-specific physical relevance',p.sport],['Cardiovascular health',p.heart],['Bone-loading contribution',p.bone]].filter(([,v])=>typeof v==='string'&&v.trim());openSheet('What this exercise develops',`<p class="purpose-name"><b>${esc(x.title)}</b></p><p><span class="purpose-tag">${esc(p.type)}</span></p>${sections.map(([t,v])=>`<section><h3>${esc(t)}</h3><p>${esc(v)}</p></section>`).join('')}<section><h3>Sources and evidence scope</h3><p>${esc(p.scope||'Training roles are reasoned programme choices. Sport relevance describes the physical capacities used by each discipline. The references provide movement instruction and supporting research; the prescribed doses are programme-specific.')}</p>${p.references.map(s=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a></p>`).join('')}</section>`);$('whyBtn').setAttribute('aria-expanded','true');}
function showUpdateNotes(){openSheet('What changed in this version',`<h3>Version 8: neck and benefits only</h3><p>Banded neck isometrics now appear on Monday, Wednesday and Thursday across all 24 weeks. Wednesday is the lighter exposure. The benefits panel shows only the relevant positive training roles and retains sources. All other exercises, doses, demonstrations, calendar and controls are unchanged.</p><p><b>Overall Week 13 is the baseline. Overall Week 14 adds at least two distinct Friday tasks.</b></p><h3>Friday 14</h3><p>Supported lateral step-down: 2 × 5 per side with three-second lowering. Core-bag bear-hug isometric: 1 × 20 seconds. These are additions to the existing lunge, hinge, ankle, adductor and suitcase work. The prior controlled lunge finish also remains.</p><h3>Week 16 targets</h3><p>Step-down gains a small held load only after repeatable unloaded control; Friday adds one light front-loaded marching set. Tuesday adds one short Pallof step-out skill set. These are meaningful targets after return tolerance is restored, not automatic post-travel clearance.</p><h3>TrainWell is protected</h3><p>Sunday explosive push-ups stay Sunday. Tuesday Arnold press stays, and the separate kettlebell strict press is additional. No Russian-twist, wall-sit, BOSU-plank, rabbit, jump-squat, squat, row, carry or stretching station is silently removed from Mike’s programme. Unknown main-app sets remain Mike’s actual prescription.</p><h3>Walking and cardio</h3><p>Monday, Wednesday and Thursday each include 15–20 minutes on a flat route. Sunday keeps the familiar run/walk and separate rope strand. Existing bike and row sessions also count. Longer walks need stable foot tolerance; there is no compulsory daily step quota.</p><h3>Workload boundary</h3><p>Keeping exercises is not clearance to perform unlimited additional volume. The full original Sunday impact block plus companion impact must be reviewed together. Additional pressing shares shoulder load even with a different implement. Reduced/stop settings remain available for fatigue, pain and travel re-entry.</p><h3>Interface</h3><p>First load opens an active Friday preview. The pre-start date screen has a working Start Friday preview button. Every exercise has this version’s purpose panel, a large sticky Close button, a linked title and a copy-name control.</p>`);}
function showHealthContext(){openSheet('Health context used',`<p>This programme uses reported history and current performance, not a claim that every listed diagnosis is active.</p><h3>Recorded lipids</h3><p>The connected November 11, 2026 panel reports direct LDL 143 mg/dL, total cholesterol 205 mg/dL, HDL 43 mg/dL and triglycerides 48 mg/dL. Exercise contributes to overall cardiovascular care; no individual drill is labelled an LDL cure.</p><h3>DEXA baseline</h3><p>Your supplied November 11, 2026 BodySpec report lists 165.4 lb total mass, 27.4% fat and 114.0 lb lean tissue. Right/left leg lean tissue is 20.0/21.3 lb. This is not proof of a functional weakness or recent muscle loss. The report is not a diagnostic local bone assessment.</p><h3>Structural history</h3><p>Foot/arch and right sesamoid symptoms; historical hip-stabilizer, knee, shoulder, back and neck issues guide the support work. You report the left foot is mostly healed. Actual symptoms and function determine the level, not an old label.</p><h3>Genetic interpretation</h3><p>The supplied genetics text is an interpretation rather than a verified raw clinical report. It does not determine tendon clearance, an optimal sport, loading dose or a promised recovery response.</p><p>Use this private context only for your own review. The exercise-purpose panels avoid exposing detailed laboratory values.</p>`);}
function showRules(){openSheet('Readiness + progression',`<p>The normal plan assumes your established movements are comfortable. Completing the old programme does not prove every painful structure has healed.</p><div class="check-grid"><div class="check green">READY: normal walking and turning, no sharp pain, swelling or limp, controlled repetitions and usual next-morning response.</div><div class="check yellow">REDUCE: increasing discomfort, altered form, unusual fatigue or a worse next morning. Familiar low-dose work only; no impact.</div><div class="check red">STOP: sharp jabs, focal worsening medial-foot pain, locking, giving way, swelling, limp, new numbness/weakness or radiating pain. Stop the provoking work and arrange assessment.</div></div><h3>Increase a demand, not everything</h3><p>Complete at least two comfortable exposures before progressing resistance, range, leverage or speed. Leave roughly two or three clean repetitions available. A major movement change and a small secondary progression are targets, not two compulsory increases. When Mike raises main-workout loads or sport sessions increase, hold companion progression.</p><h3>Power stays high quality</h3><p>Rest fully between jumps, push-up power and bag-handling sets. Stop when takeoff, landing or posture worsens. Rope work seconds, larger-jump landings and running minutes are different exposures. Your Friday app jumps count. Exact total main-app jump repetitions must be reconciled before progressing impact.</p><h3>Foot and neck boundaries</h3><p>Persistent pinpoint navicular tenderness or increasing pain with walking requires assessment before progressing impact. Do not stand on a hard ball over a painful foot structure. Neck work uses light band resistance at head height with a neutral, still head. Monday and Thursday are the progressive sessions; Wednesday is one easy round. Have the band setup checked before increasing resistance. Never place the band across the throat or eyes; no low-anchor pulling, bridges or harness progression. Stop for neck pain, headache, dizziness, visual changes, numbness or radiating symptoms.</p><h3>Equipment</h3><p>Your padded ball and handled core bag are never thrown, slammed or dropped. The medicine ball has a separate adductor-squeeze task; it is not programmed as another bag carry. No maximal standing wheel rollouts or loaded wall-bar side bends.</p><h3>Return from travel</h3><p>First seven days: familiar easy work, reduced sets and no impact. Thereafter restore familiar work based on tolerance. The return-readiness confirmation is separate for each trip. Future previews show planned targets; they do not pre-clear future loading.</p><h3>Seek urgent help</h3><p>Urgent assessment for inability to bear weight, a locked or markedly swollen knee, or a hot red joint with fever. Emergency help for new bladder/bowel dysfunction, saddle numbness or rapidly progressive leg weakness.</p>`);}
function showCoverage(){openSheet('Coverage + known limits',`<p>This map uses your reported current programme and established history. It is not an examination or a claim to have measured every weakness.</p>${DATA.coverage.map(x=>`<section><h3>${esc(x.region)}</h3><p><b>TrainWell:</b> ${esc(x.main)}</p><p><b>Companion:</b> ${esc(x.companion)}</p><p><b>Progression:</b> ${esc(x.progress)}</p><p><b>Boundary:</b> ${esc(x.boundary)}</p></section>`).join('')}`);}
function showPlan(){openSheet('Plan + tools',`<p><b>24 additional training weeks. New Week 1 = overall Week 13.</b> The original TrainWell workouts stay intact. The companion builds foot/ankle capacity, isometric strength, unilateral support, trunk control and athletic skills around them.</p><div class="row-buttons"><button class="small-btn" onclick="showUpdateNotes()">Changes in this version</button><button class="small-btn" onclick="showProgression()">24-week progression</button><button class="small-btn" onclick="showRope()">Jump-rope strand</button><button class="small-btn" onclick="showIntegration()">Protected TrainWell routine</button><button class="small-btn" onclick="showCoverage()">Coverage + limits</button><button class="small-btn" onclick="showCalendar()">Calendar</button><button class="small-btn" onclick="showHealthContext()">Private health context</button><button class="small-btn" onclick="showResearch()">Research</button><button class="small-btn" onclick="showRecovery()">Equipment roles</button></div>${PH.map(x=>`<div class="phase-card"><h3>${esc(x.name)}</h3><p>${esc(x.focus)}</p></div>`).join('')}<h3>Two concrete Friday additions at overall Week 14</h3><p>Supported lateral step-down and front-loaded core-bag isometric hold. Overall Week 16 adds controlled front-loaded marching and, after the unloaded task is established, a light held load for step-downs. The original exercises remain.</p><h3>Progression without unbounded accumulation</h3><p>Companion families develop through load, leverage and movement variants. A later variant is not a reason to perform every historical version at its full dose. No main TrainWell exercise is substituted. Strict press remains even when an optional later handling/power skill is shown.</p><h3>Evidence and video scope</h3><p>Public demonstration pages were reviewed for movement relevance. Not every clip was playable end-to-end. A custom pause, hold, support or sequence is labelled as a modification in Form details; a base-movement video is not claimed as an exact combination demonstration. No Prehab subscription is required.</p><h3>Recovery is part of the plan</h3><p>Saturday remains rest. Both travel pauses remain. Returning work is reduced temporarily and new additions wait until familiar work is tolerated. More exercise is not automatically recoverable; retain the symptom and next-morning checks.</p>`);}

function showIntegration(){openSheet('TrainWell · protected original routine',`<p>Mike’s current routine stays intact. Companion additions do not remove or relocate its exercises. Different exercise names can still load the same tissues; this is a combined-workload plan.</p>${['Friday','Sunday','Monday','Tuesday','Wednesday','Thursday'].map(d=>`<section><h3>${d}</h3><p>${esc(DATA.main[d].detail)}</p><p>${esc(DATA.main[d].cue)}</p></section>`).join('')}<h3>Ownership matters</h3><p>The Sunday explosive-push-up reference card records an exercise you already do in TrainWell, once. Tuesday’s companion strict press is a separate addition alongside Arnold press. Farmer, waiter and suitcase carries already in Tuesday TrainWell are not repeated by a second identical companion block.</p><h3>New sport classes</h3><p>Do not silently remove exercises or simply stack all club sessions on top. Use the combined schedule with Mike and the sport coaches to agree the volume before introducing contact, new lifting skills or more impact. Pause provoking work when symptomatic, regardless of a retained card.</p>`);}

function showCalendar(){const pauses=BREAKS.map(b=>{const p=positionForDate(b.resume);return`<div class="note-box"><strong>${esc(fmt(b.start))}–${esc(fmt(b.end))}: nothing scheduled.</strong><br>Resume ${esc(fmt(b.resume))} · new Week ${p.week}, overall ${p.week+12}, ${p.day}.<div class="row-buttons"><button class="small-btn" onclick="closeSheet();goDate('${b.start}')">View pause</button><button class="small-btn" onclick="closeSheet();goDate('${b.resume}')">View return</button></div></div>`;}).join('');openSheet('Calendar',`<p>New block starts <b>${fmt(state.start)}</b>. Scheduled final day: <b>${fmt(dateISO(24,'Thursday'))}</b>.</p>${pauses}<p>Default March 26 is <b>new Week 14, overall Week 26</b>. Both breaks pause the sequence; no catch-up sessions are added.</p><table><thead><tr><th>New / overall week</th><th>Scheduled dates</th><th>Focus</th></tr></thead><tbody>${Array.from({length:24},(_,i)=>`<tr><td>${i+1} / ${i+13}</td><td>${esc(weekRange(i+1))}</td><td>${esc(PH[phase(i+1)].short)}${deload(i+1)?' · reduced volume':i===23?' · review':''}</td></tr>`).join('')}</tbody></table>`);}
function showProgression(start=1){start=Math.max(1,Math.min(21,start));const weeks=Array.from({length:4},(_,i)=>start+i);let body=`<p>Changes to the approved baseline, not four extra workouts. Unmentioned exercises remain. Each target can be held at the prior level.</p><div class="row-buttons">${[1,5,9,13,17,21].map(i=>`<button class="small-btn" onclick="showProgression(${i})">${i+12}–${i+15}</button>`).join('')}</div><div class="phase-table"><table><thead><tr><th>Day</th>${weeks.map(w=>`<th>Overall ${w+12}<br><small>New ${w}</small></th>`).join('')}</tr></thead><tbody>`;
 for(const d of DAYS){body+=`<tr><th>${d}</th>`;for(const w of weeks){const c=context(w,d,true);let t='';if(d==='Saturday')t='Rest.';else if(c.rt&&w!==4)t=c.rt===1?'Return: reduced familiar work, no impact.':'Restore familiar work according to tolerance.';else if(c.light)t=w===24?'Review established versions; no maximum attempts.':'Deload: established variants, fewer sets.';else{const a=DATA.plans[String(w)][d].filter(x=>x.newThisWeek&&x.key!=='rope');t=a.length?a.map(x=>`<b>${esc(EX[x.ex].title)}</b><br>${esc(x.dose)}<br><small>${esc(x.change)}</small>`).join('<hr>'):w===1?'Approved Week 13 baseline.':'Repeat established versions; consolidate quality.';}body+=`<td>${c.rt&&w===4?'<small>Targets after return tolerance is restored.</small><br>':''}${t}</td>`;}body+='</tr>';}
 body+='</tbody></table></div><div class="row-buttons"><button class="small-btn" onclick="showRope()">Separate jump-rope progression</button><button class="small-btn" onclick="showFullWeek()">Full selected week</button></div>';openSheet('Your 24-week progression',body);}
function showFullWeek(){openSheet(`Full plan · overall Week ${state.week+12}`,`<p>Planned recipes for approval/review. The selected day cards apply current readiness and return adjustments.</p>${DAYS.map(d=>`<section><h3>${d}</h3>${d==='Saturday'?'<p>Rest.</p>':`<ol>${DATA.plans[String(state.week)][d].map(x=>`<li><a href="${esc(EX[x.ex].url)}" target="_blank" rel="noopener noreferrer">${esc(EX[x.ex].title)}</a><br>${esc(x.dose)}${x.change?`<br><small>${esc(x.change)}</small>`:''}</li>`).join('')}</ol>`}</section>`).join('')}`);}
function showResearch(){openSheet('Research + design decisions',`<p><b>Sources of this revision:</b> your uploaded HTML supplies the visual structure and controls. The approved conversation supplies the Week 13 baseline and later progression. New solo substitutions and exact doses are programming choices, not a published validated protocol.</p><p>The exercise rationales describe physical capacities relevant to striking and grappling. They do not establish a direct transfer to any particular technique, injury prevention or readiness for contact.</p>${DATA.sources.map(s=>`<section><h3><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></h3><p>${esc(s.kind)}<br>${esc(s.use)}</p></section>`).join('')}<h3>Video references</h3><p>Public YouTube/Vimeo links are preferred; a few university or manufacturer pages remain for exact setups. These are demonstration references, not proof of effectiveness. Linked titles and indexed descriptions were checked where accessible; not every clip could be played end-to-end. The card explicitly distinguishes a base demonstration from a prescribed pause, hold or sequence.</p>`);}
function showRecovery(){openSheet('Equipment roles',`<table><tr><th>Tool</th><th>Assigned role</th></tr><tr><td>Handled core bag</td><td>Lateral loading, front holds, carries and later controlled handling. No throwing, slamming or dropping.</td></tr><tr><td>Padded medicine ball</td><td>Distinct adductor-squeeze holds when its size permits comfortable knee position. Weight is not the squeezing resistance. Not another carry substitute.</td></tr><tr><td>Stability ball</td><td>Dead-bug pressure and a rollout alternative. Not the weighted medicine ball.</td></tr><tr><td>TRX</td><td>Monday knee-flexion hamstring strength, progressing from bilateral toward assisted unilateral loading.</td></tr><tr><td>Ab wheel</td><td>Kneeling, wall-limited forward reach alongside the separate side-plank slot.</td></tr><tr><td>Bands and weights</td><td>Ankle/cuff/hip resistance, controlled pressing, bracing, carries and supported wrist work.</td></tr><tr><td>Wall bars</td><td>Stable support and gentle known mobility positions. No weighted side-bend/leg-elevated stretching progression.</td></tr><tr><td>Small soft ball</td><td>Between-heels cue, never underneath a painful foot structure during a loaded heel raise.</td></tr><tr><td>BOSU / Smith / slant board</td><td>No compulsory extra use. Existing BOSU plank work must replace a core station rather than duplicate it. No unstable-surface jump requirement.</td></tr><tr><td>Bike / rower / treadmill</td><td>Main-app cycling and rowing remain. Sunday keeps familiar level run/walk unless reduced or replaced by easy cycling.</td></tr></table><h3>Comfort tools</h3><p>CastleFlexx, massage gun, Hip Hook, Range and Orbit are optional comfort/mobility tools. They do not substitute for progressive tendon loading. Follow manufacturer positions; do not apply improvised deep pressure to a painful structure or the front/side of the neck.</p><p><a href="https://alethahealth.com/pages/howto" target="_blank" rel="noopener noreferrer">Official Aletha instructions</a></p>`);}

function showSettings(){const b=returnSettingsBreak(),r=state.returnSettings[b.id];openSheet('Setup + readiness',`<label for="setStart">New Week 1 starts (Friday)</label><input type="date" id="setStart" value="${state.start}"><label for="setStatus">Movement readiness</label><select id="setStatus">${option('ready','Usual movements comfortable; no sharp symptoms',state.status)}${option('yellow','Reduced familiar work; no impact',state.status)}${option('stop','Stop provoking work / assessment',state.status)}</select><label for="setCardio">Sunday cardio</label><select id="setCardio">${option('mixed','Planned rope + familiar 18-minute run/walk',state.cardio)}${option('run','Run priority: rope stays short',state.cardio)}${option('bike','Low impact: easy bike, no rope/run/jumps',state.cardio)}</select><label for="setCore">Rollout slot</label><select id="setCore">${option('wheel','Kneeling ab wheel at a controlled reach',state.coreSkill)}${option('ball','Kneeling stability-ball rollout instead',state.coreSkill)}</select><p class="help">Side plank remains a separate slot in both cases.</p><label for="setClasses">Additional sport sessions</label><select id="setClasses">${option(0,'No added sessions',state.classes)}${option(1,'One added sport session: review combined workload',state.classes)}${option(2,'Two or more: reduced companion + workload review',state.classes)}</select><h3>Return from ${fmt(b.resume)}</h3><input type="hidden" id="setReturnBreak" value="${b.id}"><label for="setReturnHold">Return control</label><select id="setReturnHold">${option('auto','Date-based return, then restore as tolerated',r.hold)}${option('stage1','Keep easy familiar work; no impact',r.hold)}${option('stage2','Keep reduced rebuilding dose',r.hold)}</select><label><input type="checkbox" id="setReturnImpact" ${r.impact?'checked':''}>After THIS trip: easy re-entry sessions and next mornings have stayed comfortable</label><p class="help">Never pre-check this for a future trip. The first seven days remain no-impact. Week previews show planned targets without claiming future readiness.</p><label for="setRecovery">Optional comfort on recovery days</label><select id="setRecovery">${['none','ball','theragun','castle','hiphook','range','orbit'].map(v=>option(v,v==='none'?'None':EQUIP[v],state.recovery)).join('')}</select><button class="close" onclick="applySettings()">Save settings</button><div class="row-buttons"><button class="small-btn" onclick="exportBackup()">Export backup</button><label class="small-btn" style="margin:0;cursor:pointer">Import backup<input type="file" accept="application/json,.json" onchange="importBackup(this)" hidden></label></div><p class="help">Local browser storage only. This file neither reads medical records nor changes TrainWell. Older notes are preserved as an archive, not silently attached to changed exercises.</p>`);}
function applySettings(){const start=$('setStart').value;if(!validDate(start)||new Date(utcDay(start)).getUTCDay()!==5||pausedDate(start)){toast('Choose a valid Friday outside the pauses.');return;}const bid=$('setReturnBreak').value;state=normalise({...state,start,status:$('setStatus').value,cardio:$('setCardio').value,coreSkill:$('setCore').value,classes:Number($('setClasses').value),recovery:$('setRecovery').value,returnSettings:{...state.returnSettings,[bid]:{hold:$('setReturnHold').value,impact:$('setReturnImpact').checked}},idx:0});calendarCache=null;save();closeSheet();render();toast('Settings saved.');}
function holdLevel(key){const hk=state.day+':'+key;openSheet('Repeat a previous level',`<p>This changes the actual dated-session card for this slot. The planned progression tables remain visible.</p><label for="holdWeek">Exercise week to repeat</label><select id="holdWeek">${Array.from({length:state.week},(_,i)=>{const w=i+1,x=DATA.plans[String(w)][state.day].find(x=>x.key===key);return x?option(w,`Overall ${w+12}: ${EX[x.ex].title}`,state.holds[hk]||state.week):'';}).join('')}</select><button class="close" onclick="saveHold('${esc(hk)}')">Save repeated level</button>`);}
function saveHold(k){state.holds[k]=Number($('holdWeek').value);save();closeSheet();render();toast('Repeated level saved for actual dated sessions.');}
function showLog(){if(viewPosition().kind!=='training'){openSheet('Nothing scheduled','<p>No workout is scheduled for this date.</p>');return;}const n=state.notes[dayKey()]||{};openSheet('Session + next-morning note',`<p>${fmt(dateISO(state.week,state.day))} · overall Week ${state.week+12} · ${state.day}</p><label for="noteLoad">Actual loads, repetitions, holds, reach and support</label><textarea id="noteLoad" rows="4" placeholder="Record the resistance, assistance and variant actually used.">${esc(n.load||'')}</textarea><label for="noteAfter">During / afterward</label><textarea id="noteAfter" rows="3" placeholder="Location of symptoms, quality, fatigue, total session time.">${esc(n.after||'')}</textarea><label for="noteMorning">Next morning</label><textarea id="noteMorning" rows="3" placeholder="Back to baseline? Swelling, sharp pain, limp, unusual fatigue?">${esc(n.morning||'')}</textarea><button class="close" onclick="saveLog()">Save note</button>${Object.keys(state.legacyNotes).length?'<button class="small-btn" onclick="showOldNotes()">Archived earlier-file notes</button>':''}`);}
function saveLog(){state.notes[dayKey()]={date:dateISO(state.week,state.day),load:$('noteLoad').value,after:$('noteAfter').value,morning:$('noteMorning').value};save();closeSheet();toast('Saved locally.');}
function showOldNotes(){openSheet('Archived earlier-file notes',Object.entries(state.legacyNotes).map(([k,v])=>`<section><h3>${esc(k)}</h3><p>${esc(v.date||'')}</p><p>${esc(v.load||'')}</p><p>${esc(v.after||'')}</p><p>${esc(v.morning||'')}</p></section>`).join('')||'<p>No archived notes.</p>');}
function showRope(){const n=state.ropeLogs[String(state.week)]||{};openSheet('Jump-rope strand',`<p><b>Basic bounce → small weight shifts → alternating-foot segments → boxer step → repeatable boxer-step bouts.</b> No compulsory double-unders, weighted rope, one-hour sessions or long single-leg hopping sets.</p><p>Sunday is the impact-practice slot. Wednesday is grounded rehearsal only. Progress after repeatable technique and calm next mornings, not just because the date changed.</p><label for="ropeCap">Maximum planned rope level currently tolerated</label><select id="ropeCap">${option(24,'Use scheduled target; repeat lower level when needed',state.ropeCap)}${Array.from({length:23},(_,i)=>option(i+1,`Hold at overall Week ${i+13}`,state.ropeCap)).join('')}</select><button class="small-btn" onclick="saveRopeCap()">Save rope level</button><div class="table-scroll"><table><thead><tr><th>Overall week</th><th>Target</th><th>Skill emphasis</th></tr></thead><tbody>${DATA.rope.map((r,i)=>`<tr><td>${i+13}</td><td>${r.sets?`${r.sets} × ${r.seconds} sec<br><small>${r.sets*r.seconds} sec active</small>`:'Initial return: grounded only'}</td><td>${esc(r.focus)}</td></tr>`).join('')}</tbody></table></div><p>Rest 40–60 seconds between short bouts and 60–90 seconds between longer bouts. Intermediate 45/50/60-second steps are allowed; repeat a dose instead of forcing a jump. The final review targets three 75-second bouts; 90-second bouts come later only when earned. During a new linked-jump week, rope does not increase.</p><h3>Log selected week: overall ${state.week+12}</h3><label for="ropeClean">Longest clean bout (seconds)</label><input type="number" min="0" max="3600" id="ropeClean" value="${esc(n.clean??'')}"><label for="ropeCatches">Rope catches / actual pattern</label><input id="ropeCatches" value="${esc(n.catches||'')}"><label for="ropeResponse">During / next morning</label><textarea id="ropeResponse" rows="2">${esc(n.response||'')}</textarea><button class="close" onclick="saveRopeLog()">Save rope note</button><div class="row-buttons"><a class="watch" href="${EX.ropeAlt.url}" target="_blank" rel="noopener noreferrer">Alternating-foot video ↗</a><a class="watch" href="${EX.ropeBox.url}" target="_blank" rel="noopener noreferrer">Boxer-step video ↗</a></div>`);}
function saveRopeCap(){state.ropeCap=Math.max(1,Math.min(24,Number($('ropeCap').value)||24));save();toast('Rope level saved.');}
function saveRopeLog(){const v=$('ropeClean').value;state.ropeLogs[String(state.week)]={clean:v===''?'':Math.max(0,Math.min(3600,Number(v)||0)),catches:$('ropeCatches').value,response:$('ropeResponse').value};save();closeSheet();render();toast('Rope note saved.');}
function openCue(){const x=current()[state.idx];const mode=x.cueMode||'lr';openSheet('Solo direction cues',`<p>Use short controlled steps. Place the screen ahead of you; no partner is required. Stop completely before the next cue.</p><div id="cueWord" class="cue-word" aria-live="polite">Ready</div><div class="row-buttons"><button class="small-btn" onclick="startCue('${mode}')">Start · one cue every 4 seconds</button><button class="small-btn" onclick="stopCue()">Stop</button></div><p>For single-leg reach practice, a cue selects a direction only. Do not rush to keep up.</p>`);}
function startCue(mode){stopCue();const labels=mode==='four'?['FORWARD','BACK','LEFT','RIGHT']:mode==='reach'?['FORWARD','DIAGONAL','SIDE']:['LEFT','RIGHT'];let last='';function tick(){let opts=labels.filter(x=>x!==last),v=opts[Math.floor(Math.random()*opts.length)];last=v;if($('cueWord'))$('cueWord').textContent=v;else stopCue();}tick();cueTimer=setInterval(tick,4000);}
function stopCue(){if(cueTimer)clearInterval(cueTimer);cueTimer=null;}
function showLibrary(){const used=new Set(Object.values(DATA.plans).flatMap(w=>Object.values(w).flatMap(a=>a.map(x=>x.ex))));['ballroll','ropeAlt','ropeBox','neck'].forEach(x=>used.add(x));openSheet('All instructional videos',`<p>Tap an exercise title to open its demonstration. A combination may link only the base movement. Its added pause, support or sequence is explicitly described in Form details. Public destinations were reviewed; not every video was playable end-to-end. Recency alone does not make a tutorial more suitable.</p><div class="video-index">${[...used].sort((a,b)=>EX[a].title.localeCompare(EX[b].title)).map(k=>{const x=EX[k];return`<div><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><strong>${esc(x.title)} ↗</strong></a><small>${esc(x.provider)} · ${/youtu/.test(x.url)?'YouTube':/vimeo/.test(x.url)?'Vimeo':'Public video page'}</small></div>`;}).join('')}</div>`);}
function exportBackup(){const blob=new Blob([JSON.stringify({version:FILE_VERSION,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TrainWell_Companion_Backup_v8.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importBackup(input){try{const f=input.files[0];if(!f)return;const d=JSON.parse(await f.text());if(![1,2,3,4,5,6,7,8].includes(d.version)||!d.state||!DAYS.includes(d.state.day))throw Error('invalid');state=d.version>=6?normalise(d.state):normalise({start:d.state.start,status:d.state.status,legacyNotes:d.state.notes||{}});calendarCache=null;save();closeSheet();render();toast(d.version>=6?'Backup restored.':'Earlier notes archived; review the revised plan from Week 1.');}catch(e){toast('That file is not a valid companion backup.');}}
async function copyName(){const t=current()[state.idx].title;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);else throw Error('fallback');toast('Exercise name copied');}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(ok)toast('Exercise name copied');else{openSheet('Copy exercise name',`<input id="manualCopy" value="${esc(t)}" readonly style="width:100%;padding:12px;font-size:17px">`);$('manualCopy').select();}}}
function stopTimer(){if(timer)clearInterval(timer);timer=null;if($('timerOutput'))$('timerOutput').textContent='';if($('stopTimer'))$('stopTimer').hidden=true;}
function startTimer(n){stopTimer();const end=Date.now()+n*1000;$('stopTimer').hidden=false;function tick(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));$('timerOutput').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left){clearInterval(timer);timer=null;$('stopTimer').hidden=true;toast('Timer finished');}}tick();timer=setInterval(tick,250);}
function goDate(s){if(!validDate(s)){toast('Choose a valid date.');return;}const p=positionForDate(s);state.viewDate=s;state.idx=0;if(p.kind==='training'){state.week=p.week;state.day=p.day;}else if(p.kind==='pause'){const r=positionForDate(breakForDate(s).resume);if(r.kind==='training'){state.week=r.week;state.day=r.day;}}render();}
function goToday(){goDate(localISO());}
for(let w=1;w<=24;w++){const o=document.createElement('option');o.value=w;o.textContent=`${w} · overall ${w+12}${deload(w)?' · lighter':w===24?' · review':''}`;$('weekSelect').append(o);}
for(const d of DAYS){const o=document.createElement('option');o.value=d;o.textContent=d;$('daySelect').append(o);}
$('weekSelect').onchange=e=>{state.week=Number(e.target.value);state.idx=0;state.viewDate=null;render();};$('daySelect').onchange=e=>{state.day=e.target.value;state.idx=0;state.viewDate=null;render();};$('dateSelect').onchange=e=>goDate(e.target.value);
const bindings={nextBtn:next,backBtn:previous,todayBtn:goToday,rulesBtn:showRules,planBtn:showPlan,settingsBtn:showSettings,overviewBtn:showOverview,libraryBtn:showLibrary,logBtn:showLog,copyBtn:copyName,stopTimer:stopTimer,coverageBtn:showCoverage,calendarBtn:showCalendar,ropeBtn:showRope,whyBtn:showPurpose};for(const [id,fn]of Object.entries(bindings))$(id).onclick=fn;
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>startTimer(Number(b.dataset.time)));$('overlay').onclick=e=>{if(e.target===$('overlay'))closeSheet();};
document.addEventListener('keydown',e=>{if($('overlay').classList.contains('open')){if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const a=[...$('sheet').querySelectorAll('a[href],button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!a.length)return;const first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(['SELECT','INPUT','TEXTAREA','BUTTON','A','SUMMARY'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'||e.key==='Enter')next();if(e.key==='ArrowLeft')previous();});
let touch=null;$('card').addEventListener('touchstart',e=>{if(e.target.closest('a,button,summary,details'))return;touch={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY};},{passive:true});$('card').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].screenX-touch.x,dy=e.changedTouches[0].screenY-touch.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():previous();}touch=null;},{passive:true});
window.companion={version:FILE_VERSION,showNeckProgression,showPurpose,showUpdateNotes,showHealthContext,breaks:BREAKS,dayPlan,current,exercises:EX,phases:PH,scheduledDates,dateISO,weekRange,positionForDate,returnStage,goDate,goToday,showCalendar,showCoverage,showProgression,showRope,rawRecipes,getState:()=>JSON.parse(JSON.stringify(state)),setState:s=>{state=normalise({...state,...s});calendarCache=null;render();},render};
if(firstOpen){state.week=1;state.day='Friday';state.idx=0;state.viewDate=null;}render();

</script>
