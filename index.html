[hidden]{display:none!important}.purpose-button{display:block;width:100%;text-align:left;border:1px solid var(--gold-soft);background:var(--gold-pale);color:var(--ink);border-radius:16px;min-height:54px;padding:14px 16px;font-size:16px;font-weight:850;margin-top:16px;line-height:1.4}.purpose-button:focus-visible,.large-close:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.sheet-closebar{position:sticky;top:-22px;z-index:5;background:var(--card);padding:10px 0 12px;margin:-10px 0 15px;border-bottom:1px solid var(--line)}.large-close{display:block;width:100%;min-height:56px;padding:14px 18px;border:0;border-radius:15px;background:var(--ink);color:var(--card);font:inherit;font-size:18px;font-weight:900}.purpose-tag{display:inline-block;padding:8px 11px;border-radius:11px;background:var(--gold-pale);font-weight:750;font-size:14px}.close-details{min-height:48px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--gold-pale);font-weight:800;color:var(--ink);margin-top:12px}.purpose-name{font-size:20px!important}.sheet{scrollbar-gutter:stable}.card{scroll-margin-top:12px}@media(max-width:560px){.sheet{max-height:92dvh}.sheet-closebar{top:-22px}.purpose-button{font-size:15px}.copy-btn{min-width:46px;min-height:46px}.controls .btn{min-height:58px}}

d secure foot-harness setup. Support the lower leg; turn the foot inward against resistance without rotating the knee. Return under control. Hold a comfortable mid-range position on the prescribed hold set.","gear":["cable","seat","support"],"cue":"Retain the cable machine as the strength baseline. Attach resistance to the foot, not merely above the ankle. No forced end-range inversion, toe gripping or focal navicular pain.","rest":"30–45 sec","regression":"Reduce cable resistance or comfortable range. A light band is an explicitly chosen low-load alternative, not an automatic progression.","progression":"Progress cable load, repetitions or a comfortable hold after repeatable symptom-stable exposures. Change only one demand at a time.","form_note":"Shows seated cable inversion as an animation. Your foot harness, the isometric hold and exact resistance are not demonstrated. Keep the attachment on the foot, with the lower leg still; have the setup checked.","type":"exercise","why":"Separate dynamic and sustained medial-ankle loading. The exact cause of medial-foot pain is not established here.","verified_on":"2026-11-11","purpose":{"type":"Rehab-support / local strength and control","primary":"Strength and sustained force in the muscles that turn the foot inward, including the tibialis posterior.","personal":"Builds medial-ankle strength and the muscular support of the arch around your tibialis-posterior training focus.","sport":"Boxing and Muay Thai/kickboxing: foot support during stance changes. Wrestling and judo: steadier support as body weight shifts.","references":[{"label":"NHS: tibialis-posterior strengthening and load management","url":"https://www.sfh-tr.nhs.uk/patients-and-visiting/patient-information-leaflets/musculoskeletal-msk/tibialis-posterior-tendinopathy/"},{"label":"Exercise demonstration: Fitwill · cable animation","url":"https://fitwill.app/exercise/6746/cable-seated-foot-inversion/video/"}]}},"eve":{"id":"eve","title":"Cable ankle eversion","url":"https://uk.physitrack.com/home-exercise-video/cable-machine-eversion","provider":"Physitrack","detail":"Use your established low-cable and secure foot-harness setup with the lower leg supported. Turn the forefoot outward against the cable, keeping the knee still, then return slowly.","gear":["cable","seat","support"],"cue":"Cable strength work remains cable strength work. Keep the lower leg still and avoid snapping or forcing the foot outward.","rest":"30–45 sec","regression":"Reduce cable load or range. Do not twist the whole leg to move the weight.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Shows cable eversion with resistance attached to the foot. The prescribed dose and controlled tempo belong to this card. Not a band substitution.","type":"exercise","why":"Lateral-ankle resistance complements the medial-foot work and stable receiving-leg control.","verified_on":"2026-11-11","purpose":{"type":"Rehab-support / local strength and control","primary":"Strength and controlled lowering in the ankle evertors on the outside of the lower leg.","personal":"Strengthens the outer-ankle muscles that control the foot against inward rolling.","sport":"Boxing and Muay Thai/kickboxing: ankle control in lateral footwork. Wrestling and judo: supporting-leg control during changes of direction.","references":[{"label":"Exercise demonstration: Physitrack","url":"https://uk.physitrack.com/home-exercise-video/cable-machine-eversion"}]}},"copen":{"id":"copen","title":"Copenhagen adduction · movement + hold","url":"https://vimeo.com/647962374","provider":"E3 Rehab","detail":"Using the already-tolerated medium support lever, lift and lower the hips under control for the moving sets. Finish with one steady side-bridge hold at the same support position.","gear":["bench","mat"],"cue":"Use the familiar support position, not the longest lever by default. A shorter lever is valid. Stop for groin, knee or shoulder pain.","rest":"45–75 sec","regression":"Keep the lower foot on the floor to assist, or shorten the hold.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Shorter-lever Copenhagen demonstration. Use the established comfortable knee-support position for the dynamic repetitions and the separate hold. Do not infer readiness for a longer lever from the video.","type":"exercise","why":"Adductor force through movement plus sustained positional force. Relevant physical preparation for stance and close-contact work.","alternative_links":[{"label":"Shorter-support Copenhagen setup","url":"https://vimeo.com/647962374"}],"verified_on":"2026-11-11","purpose":{"type":"Adductor strength / isometrics","primary":"Inner-thigh strength through lifting, lowering and holding the pelvis in a side-supported position.","personal":"Builds inner-thigh force and active support of the pelvis.","sport":"Wrestling, judo and BJJ: leg-adduction and pelvic-control capacity used in close-contact positions. Muay Thai/kickboxing: hip control during single-leg actions.","references":[{"label":"Harøy et al.: Copenhagen-based adductor strengthening trial","url":"https://pubmed.ncbi.nlm.nih.gov/29891614/"},{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/647962374"}]}},"carry":{"id":"carry","title":"Suitcase carry · controlled stop","url":"https://www.youtube.com/watch?v=IAa-5uP7tSY","provider":"E3 Rehab","detail":"Walk upright with one manageable weight. Keep normal steps and breathing. Finish the final set with a five-second upright still hold before lowering deliberately.","gear":["db","walkway","support"],"cue":"This Friday slot is separate from Tuesday’s counted-once TrainWell carry block. Do not repeat Tuesday’s farmer/waiter/suitcase work afterward. Use familiar load initially.","rest":"60–90 sec between paired sides","regression":"Use a lighter weight or a shorter distance. Skip while walking itself provokes sharp pain.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Grip and lateral-trunk force while walking and standing. Carries in TrainWell count toward the same workload.","purpose":{"type":"Loaded posture / isometric strength / grip","primary":"Grip endurance and resistance to sideways trunk bending while carrying an asymmetric load.","personal":"Develops trunk resistance to sideways bending and handgrip endurance.","sport":"Wrestling, judo and BJJ: grip and posture under external resistance. Muay Thai: sustained upper-body holding capacity.","references":[{"label":"NSCA: loaded carries and trunk/hip stability","url":"https://www.nsca.com/education/articles/nsca-coach/increase-hip-and-trunk-stability-with-loaded-carries/"},{"label":"Exercise demonstration: E3 Rehab","url":"https://www.youtube.com/watch?v=IAa-5uP7tSY"}]}},"rdl":{"id":"rdl","title":"Supported single-leg RDL · paused","url":"https://www.youtube.com/watch?v=oLvO_wT0a0E","provider":"RTG Performance","detail":"Keep one hand on a rail. Hinge over one leg with the pelvis square; pause two seconds at the controlled bottom position and return.","gear":["wall","db","support"],"cue":"Support remains available. Change either load or support, not both. No twisting or radiating back/leg symptoms.","rest":"60–90 sec","regression":"Use bodyweight and a shorter hinge.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Demonstrates a supported single-leg Romanian deadlift. The prescribed two-second pause is an added programme cue. Support remains when it improves controlled loading.","type":"exercise","why":"Unilateral hip force with trunk control while the opposite leg moves.","verified_on":"2026-11-11","purpose":{"type":"General strength / unilateral control","primary":"Single-leg hamstring and gluteal strength, hip-hinge control and pelvic stability.","personal":"Builds single-leg posterior-chain strength and pelvic control that support your hip and low-back capacity work.","sport":"Wrestling and judo: hip strength for driving and resisting displacement. Muay Thai/kickboxing: control over the supporting leg.","bone":"Loaded muscle contractions and weight-bearing supply a strengthening stimulus to the bones of the legs and hips.","references":[{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: RTG Performance","url":"https://www.youtube.com/watch?v=oLvO_wT0a0E"}]}},"lunge":{"id":"lunge","title":"Core-bag lateral lunge to box · paused","url":"https://www.dvidshub.net/video/549939/sandbag-lateral-lunge","provider":"U.S. Marine Corps · DVIDS","detail":"Hold a manageable handled bag close to the chest. From a comfortable wide stance, shift to one hip and sit back toward the familiar box. Pause for two seconds, then drive back to centre.","gear":["bag","box","support"],"cue":"Use the familiar box height. No knee twist, bouncing off the box or larger bag jump just because it is available.","rest":"60–90 sec","regression":"Use a lighter bag, a dumbbell, a higher box or the familiar unweighted lateral lunge.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Demonstrates a handled, front-loaded sandbag lateral lunge. The box, pause and any balance/exit finish are written modifications, not shown as one exact sequence. Keep your familiar comfortable depth.","type":"exercise","why":"Loaded lateral force and holding posture support a strong base in striking and grappling. This is conditioning, not a throw or takedown.","verified_on":"2026-11-11","purpose":{"type":"Hip capacity / balance / general strength","primary":"Loaded lateral leg strength, adductor capacity and control at the bottom of a lateral lunge.","personal":"Develops lateral hip strength, inner-thigh capacity and knee control under load.","sport":"Wrestling and judo: a strong lateral base. Boxing and kickboxing: lateral force and control when changing position.","bone":"Loaded muscle contractions and weight-bearing supply a strengthening stimulus to the bones of the legs and hips.","references":[{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: U.S. Marine Corps · DVIDS","url":"https://www.dvidshub.net/video/549939/sandbag-lateral-lunge"}]}},"er":{"id":"er","title":"External rotation at 45° · paused","url":"https://vod.video.cornell.edu/media/Shoulder%2Bexternal%2Brotation%2Bat%2B45%2Bdegrees/1_8er8jyjg","provider":"Cornell Health","detail":"Support the upper arm at the familiar comfortable angle, up to about 45°. Rotate outward without moving the trunk; hold the comfortable finish for two seconds and return.","gear":["band","seat"],"cue":"Retain the familiar angle and start with familiar resistance. Do not force the elbow to shoulder height. One easy preparation set is separate from the working sets.","rest":"30–45 sec","regression":"Return to elbow-by-side external rotation with a lighter band.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Demonstrates external rotation with the arm at approximately 45 degrees. Use the prescribed comfortable resistance and pause, not a forced outer range.","type":"exercise","why":"Rotator-cuff force and controlled shoulder positioning alongside the main presses and pulls.","verified_on":"2026-11-11","purpose":{"type":"Shoulder capacity / rehab-support strength","primary":"Rotator-cuff external-rotation strength and sustained control of the upper arm at the prescribed angle.","personal":"Builds rotator-cuff strength and control of the upper-arm position within your shoulder-support work.","sport":"Boxing and Muay Thai/kickboxing: shoulder control during reaching and guard positioning. Wrestling and BJJ: shoulder control during supported pushing.","references":[{"label":"Exercise demonstration: Cornell Health","url":"https://vod.video.cornell.edu/media/Shoulder%2Bexternal%2Brotation%2Bat%2B45%2Bdegrees/1_8er8jyjg"}]}},"plus":{"id":"plus","title":"Serratus push-up plus · paused","url":"https://vod.video.cornell.edu/media/Push%2BUp%2BPlus/1_46uhdpf5","provider":"Cornell Health","detail":"From your comfortable incline or floor support, keep elbows straight and move the shoulder blades around the ribs. Hold the push-away position for two seconds.","gear":["bench"],"cue":"The plus is a small scapular motion. No shoulder collapse or back sag. Choose extra hold or extra band tension, not both at introduction.","rest":"30–45 sec","regression":"Use a wall or return to wall slides.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Demonstrates the base push-up-plus scapular action. Incline, added pause and later band resistance are separate card modifications; the banded version is not fully shown.","type":"exercise","why":"Shoulder-blade support for weight-bearing and force transfer without another full push-up workout.","verified_on":"2026-11-11","purpose":{"type":"Shoulder capacity / rehab-support strength","primary":"Serratus anterior strength and control of the shoulder blades as they move around the rib cage.","personal":"Develops serratus and shoulder-blade support around your shoulder-strengthening work.","sport":"Boxing and kickboxing: controlled scapular reaching. Wrestling and BJJ: shoulder support while bearing weight through the hands.","references":[{"label":"Exercise demonstration: Cornell Health","url":"https://vod.video.cornell.edu/media/Push%2BUp%2BPlus/1_46uhdpf5"}]}},"pallof":{"id":"pallof","title":"Split-stance Pallof press · five-second hold","url":"https://www.youtube.com/watch?v=qxgj5S2M7FA","provider":"Garrett McLaughlin","detail":"Stand side-on to the anchored band/cable with a comfortable split stance. Press forward and hold five seconds without letting the trunk turn. Return and reset.","gear":["band","anchor","support"],"cue":"A different stance is not automatically a progression. Keep feet comfortable, resistance manageable and breathing continuous.","rest":"45–60 sec","regression":"Use parallel feet or lighter resistance if the staggered stance irritates the knee.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Sustained anti-rotation under external resistance. Maintains a stable trunk while the limbs create force.","purpose":{"type":"Trunk strength / isometric control","primary":"Trunk strength and endurance against a sideways rotational pull in a split stance.","personal":"Builds trunk resistance to rotation while the arms or feet move.","sport":"Wrestling, judo and BJJ: resisting rotational displacement. Boxing and Muay Thai/kickboxing: maintaining trunk control as force passes between the legs and arms.","references":[{"label":"Exercise demonstration: Garrett McLaughlin","url":"https://www.youtube.com/watch?v=qxgj5S2M7FA"}]}},"neck":{"id":"neck","title":"Banded neck isometrics · four directions","url":"https://www.youtube.com/watch?v=Um9kcPjyUJg","provider":"THIRST / Brandon Smitley · four-way band isometrics","detail":"Anchor a broad, light band to a secure wall bar at forehead height. Keep the band on the skull above the ears. With the head upright and body still, face the anchor to resist a forward pull, face away to resist a backward pull, then turn each side toward the anchor. Set the gentle tension first; hold without moving your head. Ease the tension off before changing direction.","gear":["band","anchor","wall"],"cue":"Use light, controlled tension at head height, normal breathing and a relaxed jaw. Never put the band across the throat or eyes. Stop for neck pain, headache, dizziness, visual changes, tingling or radiating symptoms. Wednesday stays easy.","rest":"20–30 sec between directions; 45–60 sec between rounds","regression":"Use a lighter band with less stretch, shorten the hold, or use the original gentle hand-resisted version.","progression":"Monday and Thursday build holds from 10 toward 20 seconds per direction, then return to 10 seconds after a small resistance increase. Wednesday uses one lighter round. Increase tension only after two symptom-stable sessions at the current 20-second dose and an unchanged following morning. Hold the same head angle and stance while changing resistance. The dated doses are targets, not mandatory increases.","form_note":"The main link demonstrates anchored four-way band isometrics. The Physitrack links show each neutral-head direction with a hand-held band; our wall-bar anchor provides that resistance instead. Use this card’s submaximal dose. Before progressing band resistance, have your physiotherapist check the setup given your neck history. Baseline means light tension at about 3/10 effort, not your previously mentioned 25–35 lb band rating. Keep the anchor at head height; no low-anchor pulls, loaded neck motion, bridges or harness progression.","type":"exercise","why":"Isometric neck strength and endurance with steady head position against resistance.","purpose":{"type":"Neck isometric strength / positional endurance","primary":"Isometric strength and endurance of the neck flexors, extensors and side-bending muscles while keeping the head steady.","personal":"Builds sustained cervical muscle force and control of head position within your neck-strengthening work.","sport":"Wrestling, judo, BJJ and Muay Thai clinching: head-position endurance against controlled external resistance. Boxing and kickboxing: sustained head posture while the trunk and arms move.","references":[{"label":"Ylinen et al.: elastic-band isometric neck training trial","url":"https://pubmed.ncbi.nlm.nih.gov/12759322/"},{"label":"Physitrack: neutral-head band extension","url":"https://us.physitrack.com/home-exercise-video/resisted-isometric-cervical-extension"},{"label":"Physitrack: neutral-head band flexion","url":"https://us.physitrack.com/home-exercise-video/resisted-isometric-cervical-flexion"},{"label":"Physitrack: neutral-head lateral isometric","url":"https://us.physitrack.com/home-exercise-video/resisted-isometric-cervical-side-flexion"}],"scope":"The clinical trial studied adults with chronic nonspecific neck pain using an elastic-band strengthening programme. This companion’s three-day split and exact hold schedule are programming choices. Sport relevance describes the physical demand of maintaining head position."},"alternative_links":[{"label":"Flexion hold: forehead band, neutral head","url":"https://us.physitrack.com/home-exercise-video/resisted-isometric-cervical-flexion"},{"label":"Extension hold: back-of-head band, neutral head","url":"https://us.physitrack.com/home-exercise-video/resisted-isometric-cervical-extension"},{"label":"Side hold: neutral head, repeat left and right","url":"https://us.physitrack.com/home-exercise-video/resisted-isometric-cervical-side-flexion"},{"label":"Original hand-resisted demonstration","url":"https://www.youtube.com/watch?v=65g5fshTPRQ"}]},"wrist":{"id":"wrist","title":"Wrist extension","url":"https://vimeo.com/861439409","provider":"E3 Rehab","detail":"Support your forearm on a bench with the palm down and hand beyond the edge. Slowly raise and lower a light dumbbell at the wrist.","gear":["seat","lightdb"],"cue":"No thumb-joint pain or elbow flare. Keep the forearm supported.","rest":"30–45 sec","regression":"Use no added weight or shorter comfortable range.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Wrist-extensor capacity complements the gripping and carrying elsewhere.","purpose":{"type":"Local strength / grip-support capacity","primary":"Wrist-extensor strength and controlled wrist lowering under resistance.","personal":"Builds forearm and wrist capacity alongside the gripping and carrying already in your programme.","sport":"Judo, wrestling and BJJ: wrist positioning and forearm control during gripping and hand fighting.","references":[{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/861439409"}]}},"balance":{"id":"balance","title":"Balance with head turns","url":"https://www.youtube.com/watch?v=XIzzy_BTkVE","provider":"Travis Tarrant","detail":"Stand on one leg near support. Slowly look left and right while keeping your chest and hips facing forward.","gear":["wall","support"],"cue":"Firm floor, eyes open, fingertip support if needed.","rest":"20–30 sec","regression":"Use both feet or hold a steady single-leg stance without head turns.","progression":"Repeat this version  judo: controlled weight transfer while standing.","references":[{"label":"Exercise demonstration: Peak Physio","url":"https://www.youtube.com/watch?v=8qbYiiNyoNg"}]},"why":"Ankle and intrinsic-foot force, arch control or position sense, depending on the specific drill."},"hip":{"id":"hip","title":"90/90 hip switches · supported","url":"https://www.youtube.com/watch?v=Lx07WIkllbA","provider":"E3 Rehab","detail":"Sit with hands behind you and both knees bent. Gently move the knees from one side toward the other through a comfortable range.","gear":["mat"],"cue":"Do not force either knee down. This is easy mobility, not a deep stretch test.","rest":"20–30 sec","regression":"Use a smaller range or omit if your knee or back objects.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Active hip rotation through a comfortable range, not forced flexibility.","purpose":{"type":"Mobility / movement preparation","primary":"Active hip rotation and coordination when changing between two 90/90 sitting positions.","personal":"Builds usable hip range and active control for your hip and low-back movement foundation.","sport":"BJJ: changing hip positions on the ground. Wrestling and judo: hip positioning. Muay Thai/kickboxing: access to controlled hip range.","references":[{"label":"Exercise demonstration: E3 Rehab","url":"https://www.youtube.com/watch?v=Lx07WIkllbA"}]}},"jump":{"id":"jump","title":"Two vertical jumps → stick","url":"https://vimeo.com/665273054","provider":"Smooth Training","detail":"Perform two low-to-moderate vertical jumps in succession. Hold the second landing, reset fully, then repeat the pair.","gear":["floor","support"],"cue":"A pair is two landings. Use isolated jumps if linked landings are not comfortable and quiet. No maximum height.","rest":"60–90 sec between sets; reset between pairs","regression":"Return to forward step-to-stick.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Absorb force and produce a second effort without losing landing control.","purpose":{"type":"Plyometric power / landing control","primary":"Vertical force production, absorption of the first landing and a controlled second takeoff.","sport":"Boxing and kickboxing: forceful repositioning and controlled landings. Wrestling and judo: lower-body force production and recovery of a stable base.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"NSCA: plyometric training principles","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Smooth Training","url":"https://vimeo.com/665273054"}]}},"bound":{"id":"bound","title":"Lateral bound-to-stick","url":"https://vimeo.com/149901107","provider":"Reach Your Potential Training","detail":"Push gently sideways from one leg to the other. Hold the landing for 2 seconds, then reset before the next repetition.","gear":["floor","support"],"cue":"Retain established distance first. No rapid cuts through symptoms or forced twisting.","rest":"60–90 sec","regression":"Use a small sideways step and hold instead.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Lateral force production and controlled receiving-leg support.","purpose":{"type":"Plyometric power / landing control","primary":"Sideways force production and controlled single-leg landing.","sport":"Boxing and kickboxing: forceful repositioning and controlled landings. Wrestling and judo: lower-body force production and recovery of a stable base.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"NSCA: plyometric training principles","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Reach Your Potential Training","url":"https://vimeo.com/149901107"}]}},"rope":{"id":"rope","title":"Jump rope · basic bounce / boxer step","url":"https://www.youtube.com/watch?v=TxFeUcIPUHs","provider":"Crossrope","detail":"Use a light basic rope and tiny two-foot bounces. Relax the shoulders and turn the rope with your wrists. Stop well before fatigue changes the landing.","gear":["rope","floor","support"],"cue":"Use a light rope and low, quiet jumps. Work intervals exclude rest. Stop for forefoot pain, knee jabs, altered landing or loss of rhythm.","rest":"40–60 sec walking between intervals","regression":"Use the bike-only track if landing or toe push-off hurts.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Basic jump-rope bounce demonstration. Follow the short bouts on this card, not a full workout or higher-impact trick sequence.","type":"exercise","verified_on":"2026-11-11","purpose":{"type":"Coordination / repeated-contact conditioning","primary":"Rope timing, low-height repeated jumping, calf endurance and alternating weight-transfer rhythm.","sport":"Boxing and Muay Thai/kickboxing: rhythm, repeated foot contacts and coordination of alternating weight transfer.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"Chottidao et al.: jump-rope and plyometric training in boxers","url":"https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2022.878527/full"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Crossrope","url":"https://www.youtube.com/watch?v=TxFeUcIPUHs"}]},"why":"Low-amplitude repeated contacts, rope timing, rhythm and eventually repeatable boxer-step bouts."},"run":{"id":"run","title":"Run / walk","url":"https://www.youtube.com/watch?v=EWTGTO79h5A","provider":"Mayo Clinic","detail":"Alternate your familiar easy jog and walk. Use a comfortable self-selected speed on level ground or a treadmill at 0% incline.","gear":["cardio","support"],"cue":"Familiar comfortable speed, level route or 0% treadmill. No pace increase during weeks that advance rope or jump complexity.","rest":"Walk intervals are built in","regression":"Repeat a lower previously comfortable rung or use painless cycling.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Maintains your familiar aerobic exposure while athletic skills progress.","purpose":{"type":"Aerobic endurance / cardiometabolic activity","primary":"Aerobic endurance and the ability to repeat easy jogging bouts with walking recovery.","sport":"Boxing, wrestling, judo, BJJ and Muay Thai/kickboxing: aerobic capacity supporting recovery between repeated efforts.","heart":"Adds regular aerobic activity that supports cardiovascular fitness and healthy blood-lipid management across your weekly routine.","bone":"Repeated ground contacts supply weight-bearing loading to the bones of the lower body.","references":[{"label":"AHA: physical activity and cholesterol","url":"https://www.heart.org/en/health-topics/cholesterol/prevention-and-treatment-of-high-cholesterol-hyperlipidemia"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Mayo Clinic","url":"https://www.youtube.com/watch?v=EWTGTO79h5A"}]}},"bike":{"id":"bike","title":"Easy stationary bike","url":"https://www.healthwise.net/DukeHealth/Content/StdDocument.aspx?DOCHWID=acd9356","provider":"Duke Health / Healthwise","detail":"Adjust the seat so the knee is still slightly bent at the bottom of the pedal stroke. Pedal seated at an easy conversational effort.","gear":["bike"],"cue":"No hard intervals or standing pedaling. Stop if knee or foot pain increases.","rest":"Continuous easy effort","regression":"Shorten the session; if pedaling is painful, stop rather than force it.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Aerobic endurance / cardiometabolic activity","primary":"Aerobic endurance through rhythmic seated pedalling.","sport":"Boxing, wrestling, judo, BJJ and Muay Thai/kickboxing: aerobic capacity supporting recovery between repeated efforts.","heart":"Adds regular aerobic activity that supports cardiovascular fitness and healthy blood-lipid management across your weekly routine.","references":[{"label":"AHA: physical activity and cholesterol","url":"https://www.heart.org/en/health-topics/cholesterol/prevention-and-treatment-of-high-cholesterol-hyperlipidemia"},{"label":"Exercise demonstration: Duke Health / Healthwise","url":"https://www.healthwise.net/DukeHealth/Content/StdDocument.aspx?DOCHWID=acd9356"}]},"why":"Aerobic activity and repeatable easy-to-moderate movement at the prescribed pace."},"side":{"id":"side","title":"Side plank","url":"https://vimeo.com/647930208","provider":"E3 Rehab","detail":"Support yourself on a forearm with knees bent or legs straight. Hold hips and ribs in a steady line.","gear":["mat"],"cue":"Use the strongest comfortable established lever. End before sagging or shoulder/back symptoms; no multi-minute endurance test.","rest":"30–45 sec","regression":"Use bent knees and a shorter hold.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Lateral-trunk support and hip control. This remains alongside, not instead of, the ab-wheel slot.","purpose":{"type":"Trunk strength / isometric control","primary":"Lateral-trunk endurance and control of the pelvis during a supported hold.","personal":"Builds lateral-trunk endurance and pelvic control for your hip/low-back strength foundation.","sport":"Wrestling and BJJ: maintaining a side-supported trunk position. Judo and kickboxing: trunk and pelvic control during uneven loading.","references":[{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/647930208"}]}},"bear":{"id":"bear","title":"Multidirectional bear crawl","url":"https://www.youtube.com/watch?v=sdjX_Jdzgcg","provider":"Girls Gone Strong","detail":"Hover the knees just off the mat. Move in small opposite-hand/foot steps forward, backward and sideways. The card’s distance is the TOTAL per set, not the distance in each direction.","gear":["mat","floor"],"cue":"No speed contest or painful toe pressure. Stop before wrist, shoulder or back control changes.","rest":"45–60 sec","regression":"Use the dead bug isometric instead.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Cross-body coordination and trunk/shoulder support during ground locomotion.","purpose":{"type":"General athletic control / ground-support strength","primary":"Opposite-arm/leg coordination, shoulder-support endurance and trunk control during crawling.","personal":"Develops coordinated trunk, shoulder and hip support during ground movement and position changes.","sport":"Wrestling and BJJ: physical preparation for crawling, posting and ground-to-standing movement. Judo: coordinated transitions between low and upright positions.","references":[{"label":"Exercise demonstration: Girls Gone Strong","url":"https://www.youtube.com/watch?v=sdjX_Jdzgcg"}]}},"ball":{"id":"ball","title":"Optional massage-ball reset","url":"https://www.youtube.com/watch?v=un-PIOLAJU8","provider":"Orange County Physical Therapy","detail":"Place a massage ball between the glute muscle and a wall. Lean gently and move a little, without grinding into a painful point.","gear":["ball","wall"],"cue":"Comfort only. Avoid spine, joints, painful foot structures and radiating symptoms.","rest":"Not applicable","regression":"Skip it. No recovery tool is compulsory.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Optional comfort / recovery aid","primary":"Gentle self-massage for perceived glute-muscle comfort and relaxation.","references":[{"label":"Exercise demonstration: Orange County Physical Therapy","url":"https://www.youtube.com/watch?v=un-PIOLAJU8"}]},"why":"Optional short-term comfort or relaxation, not the programme’s progressive-strength stimulus."},"theragun":{"id":"theragun","title":"Optional Theragun calf reset","url":"https://www.youtube.com/watch?v=YIW4lW7Wvec","provider":"Therabody","detail":"Use a soft attachment at low intensity over the calf muscle belly. Keep the device moving lightly.","gear":["theragun"],"cue":"No use directly over bones, tendons, bruises, swelling, numb skin or an unexplained painful calf.","rest":"Not applicable","regression":"Skip it.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Optional comfort / recovery aid","primary":"Brief percussion massage for perceived calf-muscle comfort.","references":[{"label":"Exercise demonstration: Therabody","url":"https://www.youtube.com/watch?v=YIW4lW7Wvec"}]},"why":"Optional short-term comfort or relaxation, not the programme’s progressive-strength stimulus."},"castle":{"id":"castle","title":"Optional CastleFlexx recovery","url":"https://www.youtube.com/watch?v=D_ipVSS1kCw","provider":"CastleFlexx","detail":"Use your familiar heel-supported gentle calf/hamstring stretch. Keep the spine comfortable and stop well before a strong stretch.","gear":["castle"],"cue":"No forced big-toe extension, nerve-like tingling or end-range pulling.","rest":"Not applicable","regression":"Skip it or use the already comfortable mobility prescribed by Mike.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Optional comfort / recovery aid","primary":"Calf and hamstring mobility through a controlled supported stretch.","references":[{"label":"Exercise demonstration: CastleFlexx","url":"https://www.youtube.com/watch?v=D_ipVSS1kCw"}]},"why":"Optional short-term comfort or relaxation, not the programme’s progressive-strength stimulus."},"bandwalk":{"id":"bandwalk","title":"Glute-band lateral walk","url":"https://www.youtube.com/watch?v=y_bqFDQZSHQ","provider":"FIT.nl","detail":"Place a light mini-band just above your knees. Take small sideways steps with softly bent knees, keeping your pelvis level and both feet facing generally forward.","gear":["mini","support"],"cue":"Keep Wednesday submaximal. Small controlled steps, band above knees initially, no toe clawing or deep squat.","rest":"30–45 sec between sets","regression":"Use a lighter band, fewer steps, or side-lying hip abduction without a band if weight-bearing is uncomfortable.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Lateral hip-abductor work alongside one-leg control.","purpose":{"type":"Hip capacity / balance / general strength","primary":"Hip-abductor strength and endurance during resisted sideways stepping.","personal":"Builds hip-abductor/rotator capacity and steadier pelvic control over the standing leg.","sport":"Muay Thai/kickboxing: single-leg pelvic support. Wrestling and judo: resisting lateral displacement and repositioning the base.","references":[{"label":"Exercise demonstration: FIT.nl","url":"https://www.youtube.com/watch?v=y_bqFDQZSHQ"}]}},"stepdown":{"id":"stepdown","title":"Supported lateral step-down","url":"https://vimeo.com/647952200","provider":"E3 Rehab","detail":"Stand on a low, flat step beside a rail. Bend the standing knee and hip slowly, lightly tap the opposite heel to the floor, then rise without pushing off the tapping foot.","gear":["step","wall","support"],"cue":"Use a flat platform, not the slant board. Keep the whole standing foot supported, pelvis level and knee following the toes. Stop for a needle-like knee jab.","rest":"45–60 sec between sets","regression":"Use a lower step, a smaller lowering range and more hand support. Skip it if sharp pain occurs rather than testing repeatedly.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Hip capacity / balance / general strength","primary":"Quadriceps and hip control while slowly lowering the body on one leg.","personal":"Develops quadriceps strength and hip/knee control during single-leg lowering.","sport":"Boxing and kickboxing: control while lowering and shifting the stance. Wrestling and judo: receiving-leg control and strength.","references":[{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/647952200"}]},"why":"Hip abductor/rotator control and pelvic stability during single-leg support or lateral movement."},"ballroll":{"id":"ballroll","title":"Kneeling stability-ball rollout","url":"https://www.youtube.com/watch?v=Vzh4IiEE_jU","provider":"Movement As Medicine","detail":"Kneel on a mat with forearms on the ball. Roll forward from the shoulders and hips together, stopping before your lower back arches. Pull back under control.","gear":["stability","mat"],"cue":"A short, controlled reach is useful work. Keep breathing; this replaces one core exercise, not an extra ab circuit.","rest":"45–60 sec","regression":"Dead bug, or a shorter ball rollout.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"Trunk strength / isometric control","primary":"Trunk anti-extension strength while controlling a forward reach with the shoulders and hips.","personal":"Builds control of trunk extension as the limbs move farther from the body.","sport":"Wrestling and BJJ: trunk support during reaching and ground movement. Boxing and kickboxing: bracing while the arms and legs move independently.","references":[{"label":"Exercise demonstration: Movement As Medicine","url":"https://www.youtube.com/watch?v=Vzh4IiEE_jU"}]},"why":"Sustained trunk force against extension, side-bending or rotation while the limbs move, according to the drill."},"abwheel":{"id":"abwheel","title":"Kneeling ab-wheel rollout · wall-limited","url":"https://vimeo.com/730109469","provider":"E3 Rehab","detail":"Kneel on a pad. Start with a wall limiting the wheel’s travel. Roll out only as far as you can keep your ribs and pelvis controlled, then return without arching.","gear":["wheel","mat","wall"],"cue":"Mark the wall-limited distance. No standing rollouts, forced end range or radiating symptoms. Leave two or three clean repetitions available.","rest":"60–90 sec","regression":"Shorter wall-limited reach or stability-ball rollout.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Ab-wheel technique tutorial. Use the kneeling variation only and the wall-limited reach prescribed here. Advanced variations in a tutorial are not assigned.","type":"exercise","why":"Resist trunk extension through a measurable forward reach. Retained separately from side-plank work.","verified_on":"2026-11-11","purpose":{"type":"Trunk strength / isometric control","primary":"Trunk strength against extension through a measurable forward reach, with shoulder support under load.","personal":"Builds control of trunk extension as the limbs move farther from the body.","sport":"Wrestling and BJJ: trunk support during reaching and ground movement. Boxing and kickboxing: bracing while the arms and legs move independently.","references":[{"label":"Exercise demonstration: E3 Rehab","url":"https://vimeo.com/730109469"}]}},"trxham":{"id":"trxham","title":"TRX hamstring curl + final hold","url":"https://us.physitrack.com/home-exercise-video/trx-bilateral-hamstring-curl","provider":"Physitrack","detail":"Securely anchor the TRX. Lie supine with heels in the cradles, lift into a comfortable bridge and curl the heels toward the hips. Lower under control; hold the last curled repetition briefly.","gear":["trx","mat"],"cue":"Monday addition, not a Friday machine-curl replacement. No exaggerated low-back arch. Stop the set when hip position cannot be controlled.","rest":"60–90 sec","regression":"Use the familiar bilateral TRX curl with a shorter comfortable range, less hip elevation or fewer repetitions.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Shows a bilateral TRX hamstring curl. Longer lowering and the final short hold are prescribed modifications.","type":"exercise","why":"Knee-flexion hamstring loading supplements the hip hinging already in TrainWell.","verified_on":"2026-11-11","purpose":{"type":"Hamstring strength / posterior-chain capacity","primary":"Hamstring knee-flexion strength and control of the hips during curling, lowering and a short hold.","personal":"Builds knee-flexion hamstring strength and pelvic control, complementing your hip-hinge work.","sport":"Wrestling and judo: posterior-chain support for driving and controlling position. Muay Thai/kickboxing: supporting-leg and knee-flexion capacity.","references":[{"label":"Exercise demonstration: Physitrack","url":"https://us.physitrack.com/home-exercise-video/trx-bilateral-hamstring-curl"}]}},"bagcarry":{"id":"bagcarry","title":"Handled core-bag bear-hug carry","url":"https://www.youtube.com/watch?v=BJDy1FkNjho","provider":"Steph Gaudreau","detail":"Use the sound handles to position a manageable bag from a raised start. Hug its body close to the torso and walk with controlled steps and normal breathing. Set it down gently.","gear":["bag","walkway"],"cue":"No release, slam or drop. This is companion work in addition to the intact TrainWell session. Count all carrying and walking toward fatigue; stop before posture deteriorates.","rest":"60–90 sec","regression":"Use a lighter bag, a raised pickup or a short stationary bag hold. The medicine ball has its own separate adductor-squeeze role.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"Demonstrates a sandbag bear-hug carry. Stationary holds, alternating marches and wide turns are specified on their cards and are not claimed to be an exact full-video match.","type":"exercise","why":"Front-loaded posture and movement under an awkward load. Relevant to general close-contact strength, not a simulated grappling technique.","verified_on":"2026-11-11","purpose":{"type":"Loaded posture / isometric strength / grip","primary":"Front-loaded trunk and upper-back endurance while moving a bag held against the torso.","personal":"Develops sustained trunk and upper-back support under a front-held load.","sport":"Wrestling, judo and BJJ: posture while holding close-contact resistance. Muay Thai: general holding endurance for clinch preparation.","references":[{"label":"NSCA: loaded carries and trunk/hip stability","url":"https://www.nsca.com/education/articles/nsca-coach/increase-hip-and-trunk-stability-with-loaded-carries/"},{"label":"Exercise demonstration: Steph Gaudreau","url":"https://www.youtube.com/watch?v=BJDy1FkNjho"}]}},"bagclean":{"id":"bagclean","title":"Handled core-bag clean to front hold","url":"https://www.dvidshub.net/video/549933/sandbag-clean","provider":"U.S. Marine Corps · DVIDS","detail":"Use a light bag rated for lifting. Start from a comfortable hang with both intended handles. Use a small hinge and hip drive, keep the bag close and guide it into a supported front position. Lower deliberately.","gear":["bag","floor"],"cue":"New lifting skill: learn the linked setup at light load and use only manufacturer-permitted actions. If the rack or lowering is uncontrolled, keep the familiar carry. No throws, overhead tosses, slams or drops.","rest":"90–120 sec","regression":"Use the familiar handled core-bag bear-hug carry instead. Owning a handled bag does not establish readiness for cleans.","progression":"One controlled clean plus a carry, later two cleans plus the same carry. Learn technique before increasing load; no compulsory calendar jump.","form_note":"Shows a handled sandbag clean. The front hold and carry are added components. Only use a bag designed for the movement, with coach-checked technique and controlled lowering; no release, slam or drop.","type":"exercise","why":"Controlled load handling before front-loaded locomotion.","verified_on":"2026-11-11","purpose":{"type":"Loaded posture / isometric strength / grip","primary":"Coordinated hip drive and controlled handling of a bag into a supported front position.","personal":"Develops coordinated force from the hips through the trunk while receiving a front-held load.","sport":"Wrestling and judo: whole-body force production and control when handling resistance close to the torso.","references":[{"label":"Exercise demonstration: U.S. Marine Corps · DVIDS","url":"https://www.dvidshub.net/video/549933/sandbag-clean"}]}},"popPushUp":{"id":"popPushUp","title":"Explosive push-up · TrainWell Sunday","url":"https://www.youtube.com/watch?v=INfoyOtxiBU","provider":"Dr. Jacob Goodin · YouTube","detail":"Use the stable incline or floor level you already tolerate. Lower under control, press briskly so hands briefly leave the surface, receive softly and fully reset.","gear":["bench","floor"],"cue":"Stays on Sunday at Mike’s prescribed dose. This card records that existing work once; it is not another explosive-push-up block. No clapping, depth drop or painful shoulder/toe support.","rest":"90–120 sec or until quality returns","regression":"Use a higher secure surface and a brisk incline push-up without hand lift-off, or omit this power slot while retaining Mike’s comfortable main pressing work.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Brief upper-body power practice before fatigue. Not another pressing circuit.","purpose":{"type":"Plyometric power / landing control","primary":"Upper-body pushing power and controlled reception of the hands after each explosive repetition.","sport":"Boxing and Muay Thai/kickboxing: upper-body rate of force production. Wrestling and BJJ: rapid pushing and hand-support capacity.","bone":"Upper-body resistance supplies a mechanical loading stimulus to the arm and shoulder-girdle bones.","references":[{"label":"NSCA: plyometric training principles","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/"},{"label":"NIAMS: resistance and weight-bearing exercise for bone health","url":"https://www.niams.nih.gov/health-topics/exercise-your-bone-health"},{"label":"Exercise demonstration: Dr. Jacob Goodin · YouTube","url":"https://www.youtube.com/watch?v=INfoyOtxiBU"}]}},"bearlat":{"id":"bearlat","title":"Lateral bear crawl","url":"https://www.youtube.com/watch?v=he1k9F-P4DI","provider":"Well+Good · Kat Atienza","detail":"Hover the knees just off the mat. Move sideways in small opposite-hand/foot steps while keeping the trunk quiet. Change direction without rushing.","gear":["mat","floor"],"cue":"No speed contest. Stop before shoulder shrugging, painful wrist pressure or toe pain changes the movement.","rest":"45–60 sec","regression":"Forward/backward crawl over less distance, or dead bug if ground support is painful.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","purpose":{"type":"General athletic control / ground-support strength","primary":"Lateral ground-movement coordination, shoulder-support endurance and trunk stability.","personal":"Develops coordinated trunk, shoulder and hip support during ground movement and position changes.","sport":"Wrestling and BJJ: physical preparation for crawling, posting and ground-to-standing movement. Judo: coordinated transitions between low and upright positions.","references":[{"label":"Exercise demonstration: Well+Good · Kat Atienza","url":"https://www.youtube.com/watch?v=he1k9F-P4DI"}]},"why":"Weight-bearing shoulder support, cross-body coordination and controlled trunk movement near the floor."},"shuffle":{"id":"shuffle","title":"Lateral shuffle to controlled stop","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU","provider":"University of Denver Sports Performance","detail":"Shuffle two or three metres sideways, lower the hips slightly and stop in a balanced stance. Return the other way after resetting.","gear":["floor"],"cue":"Short controlled steps on a clear floor. No maximum cuts, planted-foot pivots or forced speed.","rest":"45–60 sec","regression":"Shorter, slower shuffles or the last comfortable footwork drill.","progression":"Repeat this version until technique is consistent and symptoms are unchanged the next morning. Progress one demand at a time; the printed week is a target, not clearance.","form_note":"The demonstration is a technique reference. Use this card’s dose, pause and range, not a full video workout.","type":"exercise","why":"Lateral movement and braking while retaining balance. Supports general change-of-direction capacity.","purpose":{"type":"Athletic coordination / movement skill","primary":"Sideways foot placement, deceleration and control of a balanced stopping position.","sport":"Boxing and Muay Thai/kickboxing: controlled movement into and out of position. Wrestling and judo: changing the base and responding to direction cues.","references":[{"label":"Exercise demonstration: University of Denver Sports Performance","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU"}]}},"broad":{"id":"broad","title":"Broad jump → stick → angle step","url":"https://catalystathletics.com/exercise/549/Broad-Jump/","provider":"Catalyst Athletics","detail":"Jump straight forward and land on both feet. Pause until balanced. To exit right, step the right foot forward-and-right, then bring the left foot along until your normal stance width is restored. Reverse the lead foot when exiting left. Reset before the ht controlled reach and return, without adding a forceful trunk turn or treating it as boxing technique.","progression":"Complete repeatable, comfortable exposures before changing one variable. Maintain the easier version when control or next-morning tolerance deteriorates.","purpose":{"type":"Shoulder capacity / rehab-support strength","primary":"Controlled shoulder-blade reaching and return against elastic resistance.","personal":"Develops controlled shoulder-blade reaching and deceleration of the returning arm.","sport":"Boxing and Muay Thai/kickboxing: physical preparation for repeated controlled reaching and arm return.","references":[{"label":"Exercise demonstration: Mark Marinch","url":"https://www.youtube.com/watch?v=KMc6cIroZF0"}]}},"press":{"id":"press","title":"Single-arm kettlebell strict press","url":"https://www.youtube.com/watch?v=ihRozd9hafw","provider":"StrongFirst","detail":"Bring a light bell to a comfortable rack using both hands if needed. Press overhead without leaning back, then return under control.","gear":["kb"],"cue":"Additional companion press. Arnold press stays in TrainWell. These share shoulder/triceps loading, so begin with a light submaximal bell and review the combined pressing volume with Mike. No painful overhead motion.","regression":"Use the already-comfortable main-workout press or reduce range/load.","rest":"60–90 sec","why":"Unilateral pressing force with trunk control.","type":"exercise","form_note":"Use the demonstration for the base movement and the prescribed card for this variation and dose.","progression":"Complete repeatable, comfortable exposures before changing one variable. Maintain the easier version when control or next-morning tolerance deteriorates.","purpose":{"type":"General upper-body strength / power when specified","primary":"Single-arm overhead pressing strength and trunk control under an uneven load.","personal":"Builds shoulder/triceps force and trunk support during unilateral overhead loading.","sport": ribed comfortable position.","progression":"Complete repeatable, comfortable exposures before changing one variable. Maintain the easier version when control or next-morning tolerance deteriorates.","purpose":{"type":"Rehab-support / local strength and control","primary":"Sustained tibialis-anterior force while holding the forefoot raised against resistance.","personal":"Builds the front-of-shin muscles used to lift and control the forefoot.","sport":"Boxing and kickboxing: controlled foot placement when stepping and repositioning.","references":[{"label":"Exercise demonstration: Cornell Health","url":"https://www.cornell.edu/video/ankle-dorsiflexion-with-band"}]}},"wallHip":{"id":"wallHip","title":"Standing hip-abduction wall press","url":"https://www.youtube.com/watch?v=1sM89m7ZTzI","provider":"Bend Movement","detail":"Stand beside a wall. Press the nearer bent leg gently into the wall while balancing on the other leg. Keep pelvis level and trunk upright.","gear":["wall","support"],"cue":"Moderate effort. Keep support within reach and do not lean away or force the standing knee inward.","regression":"Use lighter pressure and more hand support.","rest":"45–60 sec","why":"Hip-stabilizer force while maintaining single-leg support.","type":"exercise","form_note":"Use the demonstration for the base movement and the prescribed card for this variation and dose.","progression":"Complete repeatable, comfortable exposures before changing one variable. Maintain the easier version when control or next-morning tolerance deteriorates.","purpose":{"type":"Hip capacity / balance / general strength","primary":"Hip-abductor endurance and pelvic control during single-leg support.","personal":"Builds hip-abductor/rotator capacity and steadier pelvic control over the standing leg.","sport":"Muay Thai/kickboxing: single-leg pelvic support. Wrestling and judo: resisting lateral displacement and repositioning the base.","references":[{"label":"Exercise demonstration: Bend Movement","url" riving and controlling position. Muay Thai/kickboxing: supporting-leg and knee-flexion capacity.","references":[{"label":"Exercise demonstration: TRX Spain","url":"https://www.youtube.com/watch?v=99Capbn-H4w"}]}},"hipAir":{"id":"hipAir","title":"Supported hip airplane","url":"https://www.youtube.com/watch?v=zNGpdD6ig4U","provider":"Squat University","detail":"Hold a stable rail, hinge slightly on one leg, and gently rotate the pelvis open and closed over the standing hip. Keep knee aligned and foot stable.","gear":["wall","support"],"cue":"Small controlled range. Do not twist through the knee or force end range. Hand support is useful.","regression":"Supported single-leg hinge without rotation.","rest":"45–60 sec","why":"Active pelvic control over the supporting leg, without a club-specific technique.","type":"exercise","form_note":"Demonstrates hip airplane mechanics. Retain a stable hand support as prescribed; removing support is not compulsory.","progression":"Complete repeatable, comfortable exposures before changing one variable. Maintain the easier version when control or next-morning tolerance deteriorates.","verified_on":"2026-11-11","purpose":{"type":"Hip capacity / balance / general strength","primary":"Hip-rotator control and active pelvic rotation over a supporting leg.","personal":"Builds hip-abductor/rotator capacity and steadier pelvic control over the standing leg.","sport":"Muay Thai/kickboxing: single-leg pelvic support. Wrestling and judo: resisting lateral displacement and repositioning the base.","references":[{"label":"Exercise demonstration: Squat University","url":"https://www.youtube.com/watch?v=zNGpdD6ig4U"}]}},"stand":{"id":"stand","title":"Supported half-kneeling to stand","url":"https://www.youtube.com/watch?v=aDmepTyZLjI","provider":"Josh Avison","detail":"From one knee on a pad and the opposite foot forward, hold a rail lightly. Drive through the front foot to stand; return slowly to the same half-kneeling position.","gear":["mat","wal
