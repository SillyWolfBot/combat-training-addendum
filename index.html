<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>TrainWell Companion · 24-Week Athletic Combat Foundation · Travel-Aware</title><style>
  :root{
    --bg:#F4F0E7;
    --card:#FFFDF8;
    --ink:#282721;
    --muted:#716E64;
    --gold:#8A6A27;
    --gold-soft:#D8C89D;
    --gold-pale:#EEE5CF;
    --line:#DED7C9;
    --good:#51654A;
    --warn:#8D6427;
    --danger:#7F3B35;
    --shadow:0 18px 60px rgba(39,35,24,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  body{min-height:100vh;display:flex;justify-content:center;}
  button,select{font:inherit}
  button{cursor:pointer}
  .app{width:min(920px,100%);min-height:100vh;padding:18px 18px 32px;display:flex;flex-direction:column;gap:14px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{font-weight:900;letter-spacing:-.03em;font-size:clamp(20px,4vw,28px);}
  .phase-pill{background:var(--gold-pale);color:#5F4A1E;border:1px solid var(--gold-soft);padding:9px 13px;border-radius:999px;font-weight:850;font-size:14px;white-space:nowrap;}
  .selectors{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .select-wrap{background:rgba(255,255,255,.45);border:1px solid var(--line);border-radius:18px;padding:7px 12px;}
  .select-wrap label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:900;margin-bottom:2px;}
  select{width:100%;border:0;background:transparent;color:var(--ink);font-weight:900;font-size:18px;outline:none;}
  .progress{height:8px;background:#E6E0D5;border-radius:999px;overflow:hidden;}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--gold),#B69143);width:0%;transition:width .25s ease;border-radius:999px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);padding:clamp(26px,6vw,56px);min-height:58vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .card::after{content:"";position:absolute;right:-90px;top:-90px;width:220px;height:220px;background:radial-gradient(circle,var(--gold-pale),transparent 68%);pointer-events:none;}
  .step-kicker{color:var(--gold);font-weight:950;text-transform:uppercase;letter-spacing:.12em;font-size:13px;margin-bottom:18px;}
  h1{font-size:clamp(38px,8.3vw,78px);line-height:.98;letter-spacing:-.055em;margin:0;max-width:800px;font-weight:950;}
  .detail{font-size:clamp(20px,4vw,30px);line-height:1.28;margin:22px 0 0;color:#49463D;font-weight:720;max-width:760px;}
  .dose{display:inline-flex;align-items:center;gap:8px;margin-top:26px;background:var(--gold-pale);border:1px solid var(--gold-soft);border-radius:18px;padding:12px 16px;font-size:clamp(18px,3.5vw,25px);font-weight:950;color:#5C471B;width:max-content;max-width:100%;}
  .tool{margin-top:16px;color:var(--muted);font-size:16px;font-weight:780;}
  .tool strong{color:var(--ink)}
  .cue{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:17px;line-height:1.45;color:#5C594F;font-weight:650;}
  .cue b{color:var(--ink)}
  .controls{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;}
  .btn{border:0;border-radius:22px;padding:18px 16px;font-weight:950;font-size:20px;transition:.12s ease;}
  .btn:active{transform:scale(.985)}
  .back{background:#E7E1D6;color:#4B4942;}
  .next{background:var(--ink);color:var(--card);box-shadow:0 8px 22px rgba(40,39,33,.16)}
  .bottom-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .mini{border:1px solid var(--line);background:rgba(255,255,255,.35);border-radius:16px;padding:12px 8px;font-size:13px;font-weight:900;color:#5D594E;}
  .overlay{position:fixed;inset:0;background:rgba(30,29,24,.46);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20;}
  .overlay.open{display:flex}
  .sheet{width:min(900px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:28px;padding:24px;border:1px solid var(--line);box-shadow:var(--shadow);}
  .sheet h2{font-size:32px;margin:0 0 12px;letter-spacing:-.04em}
  .sheet h3{font-size:20px;margin:24px 0 8px;color:var(--gold)}
  .sheet p,.sheet li{font-size:17px;line-height:1.5;color:#4F4C43}
  .sheet ul{padding-left:22px}
  .sheet table{width:100%;border-collapse:collapse;margin-top:10px}
  .sheet th,.sheet td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:10px 7px;color:#4F4C43;line-height:1.4}
  .sheet th{color:var(--ink);font-weight:900}
  .close{width:100%;border:0;background:var(--ink);color:white;border-radius:18px;padding:15px;font-weight:900;font-size:18px;margin-top:12px}
  .check-grid{display:grid;gap:10px;margin-top:12px}
  .check{padding:14px;border-radius:16px;border:1px solid var(--line);font-weight:800}
  .green{background:#EDF2E9;color:#40533A}.yellow{background:#F5EDDB;color:#76551F}.red{background:#F3E6E3;color:#71332F}
  .tiny{font-size:12px;color:var(--muted);text-align:center;font-weight:750;padding:2px 0 0}
  @media (max-width:560px){
    .app{padding:12px 12px 24px;gap:10px}
    .card{min-height:60vh;border-radius:28px;padding:26px 22px}
    .selectors{grid-template-columns:1fr 1fr}
    .controls{grid-template-columns:.9fr 1.5fr}
    .bottom-row{grid-template-columns:1fr 1fr 1fr}
    .mini{font-size:12px;padding:11px 5px}
    .sheet th,.sheet td{font-size:14px;padding:8px 5px}
  }

  .app{max-width:920px;padding-bottom:max(26px,env(safe-area-inset-bottom));}
  .subhead{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
  .phase-pill{font-size:12px;white-space:normal;text-align:center;max-width:42%}
  .topbar{align-items:flex-start}.topcopy{max-width:65%}
  .status-strip{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
  .status-strip button{padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:12px;font-weight:750;color:var(--ink)}
  .card{min-height:500px;justify-content:flex-start;padding:32px 34px;overflow:visible}
  .card::after{display:none}.step-kicker{margin:0 0 14px;font-size:11px;line-height:1.5}
  .title-row{display:flex;align-items:flex-start;gap:12px}.title-row h1{font-size:clamp(32px,6vw,60px);line-height:1.04;flex:1;overflow-wrap:anywhere}
  .exercise-title{color:inherit;text-decoration:none}.exercise-title:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
  .copy-btn{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--gold-soft);border-radius:13px;background:var(--gold-pale);color:var(--gold);padding:10px;position:relative}
  .copy-btn svg{width:20px;height:20px}.detail{font-size:clamp(18px,3.8vw,24px);line-height:1.38;margin-top:18px;font-weight:650}
  .dose{margin-top:20px;font-size:clamp(17px,3.5vw,22px);line-height:1.4;white-space:pre-line}
  .tool{font-size:14px;line-height:1.5;margin-top:12px}.cue{font-size:15px;margin-top:14px;padding-top:14px;font-weight:550}
  .tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 7px;background:#f1ede3;margin-left:4px;font-size:10px;letter-spacing:.04em}
  .watch-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:15px}.watch{border:1px solid var(--gold-soft);background:var(--gold-pale);color:var(--gold);padding:9px 13px;border-radius:12px;font-size:14px;font-weight:800;text-decoration:none}
  .provider{font-size:12px;color:var(--muted)}.extras{margin-top:14px;font-size:14px;line-height:1.55}.extras summary{cursor:pointer;font-weight:750;color:var(--gold)}.extras p{margin:8px 0}
  .note-box{background:var(--gold-pale);border-radius:14px;padding:13px;font-size:14px;line-height:1.5;margin-top:15px}
  .danger-note{background:#f3e6e3;color:var(--danger)}.bottom-row{grid-template-columns:repeat(3,1fr)}.utility-row{display:flex;justify-content:space-between;gap:8px}
  .utility-row button{font-size:12px;background:none;border:0;color:var(--muted);padding:5px 3px;text-decoration:underline;text-underline-offset:3px}
  .sheet{padding:22px;overscroll-behavior:contain}.sheet p,.sheet li{font-size:15px;line-height:1.55}.sheet h2{font-size:28px}.sheet a{color:var(--gold);overflow-wrap:anywhere}
  .sheet section{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}.sheet label{font-size:14px;font-weight:800;display:block;margin:15px 0 6px}
  .sheet select,.sheet input[type=date],.sheet input[type=number],.sheet textarea{border:1px solid var(--line);background:var(--bg);padding:11px;border-radius:12px;width:100%;font:inherit;font-size:15px;color:var(--ink)}
  .sheet input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);vertical-align:middle;margin-right:8px}.sheet .help{font-size:12px;color:var(--muted);margin:6px 0 12px}
  .day-list{list-style:none;padding:0!important;margin:10px 0}.day-list li{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}.day-list button{background:none;border:0;color:var(--ink);padding:0;text-align:left;flex:1;line-height:1.5}
  .day-list .num{color:var(--gold);font-weight:900;min-width:22px}.day-list small{display:block;color:var(--muted);font-size:12px}
  .row-buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.small-btn{border:1px solid var(--line);background:var(--gold-pale);color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:750}
  .phase-card{padding:15px;border:1px solid var(--line);border-radius:16px;margin:10px 0}.phase-card h3{margin:0 0 6px}.phase-card p{margin:7px 0}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:16px;z-index:99;max-width:90vw;text-align:center;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}.timer{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}.timer button{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:7px 10px;font-size:12px}.timer-output{font-size:16px;font-weight:800;color:var(--gold);min-width:45px}
  .close-x{float:right;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:20px;color:var(--ink)}
  .video-index{display:grid;gap:9px}.video-index div{padding:10px 0;border-bottom:1px solid var(--line)}.video-index small{display:block;color:var(--muted);margin-top:4px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  .mini:focus-visible,.btn:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  @media(max-width:560px){.app{padding:12px 12px 24px;gap:10px}.card{padding:24px 20px;min-height:440px;border-radius:26px}.title-row{gap:8px}.title-row h1{font-size:37px}.copy-btn{width:36px;height:36px;flex-basis:36px;padding:8px}.copy-btn svg{width:18px;height:18px}.brand{font-size:21px}.phase-pill{font-size:10px;padding:8px 10px;max-width:39%}.subhead{font-size:11px}.sheet{padding:18px}.sheet th,.sheet td{font-size:12px}.btn{padding:15px 12px;font-size:18px}.watch{font-size:13px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  @media print{body{display:block}.app{display:none}.overlay{position:static;display:block!important;background:white;padding:0;backdrop-filter:none}.sheet{max-height:none;overflow:visible;width:100%;border:0;box-shadow:none}.close,.close-x,.row-buttons,button{display:none!important}.sheet a{color:black}.phase-card{break-inside:avoid}}

  .calendar-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.45);border:1px solid var(--line);border-radius:16px;min-width:0;}
  .calendar-bar label{font-size:12px;font-weight:800;color:var(--muted);flex:1;}
  .calendar-bar input{font:inherit;font-size:16px;font-weight:750;color:var(--ink);background:transparent;border:0;min-width:0;max-width:60%;padding:3px 0;}
  .calendar-notice{font-size:12px;line-height:1.5;color:#65552e;background:var(--gold-pale);border:1px solid var(--gold-soft);border-radius:12px;padding:9px 12px;}
  .audit-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .audit-row .mini{padding:11px 8px;background:var(--card);}
  .status-strip{flex-wrap:wrap;line-height:1.4;}
  .utility-row{flex-wrap:wrap;}
  .sheet{overflow-wrap:anywhere;}
  .sheet table{table-layout:fixed;}
  .sheet td,.sheet th{overflow-wrap:break-word;}
  .sheet input,.sheet select,.sheet textarea{font-size:16px!important;}
  input:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .sheet .help{line-height:1.5;}
  .card .detail,.card .cue{overflow-wrap:break-word;}
  .select-wrap{min-width:0;} .select-wrap select{max-width:100%;}
  .calendar-notice:empty{display:none;}
  @media(max-width:380px){.title-row h1{font-size:33px;}.card{padding:22px 18px;}.phase-pill{max-width:35%;}.calendar-bar{gap:8px;}.calendar-bar input{max-width:58%;}.calendar-notice{font-size:11px;}}


.phase-table{overflow-x:auto}.phase-table table{min-width:700px}.sheet .note-box{margin:14px 0}.tag{display:inline-block;background:var(--gold-pale);border-radius:8px;padding:3px 7px;font-size:12px;margin:2px}.exercise-title{overflow-wrap:anywhere}
</style></head>

knee.","rest":"30–45 sec","regression":"Use a lighter band and a smaller comfortable range.","progression":"Use a slightly stronger band after two calm sessions. A cuff only around the ankle is not a good substitute for resistance at the foot.","video_access":"Public demonstration; no paid exercise-library subscription required."},"eve":{"id":"eve","title":"Banded ankle eversion","url":"https://vod.video.cornell.edu/media/Ankle%2BEversion%2Bwith%2BBand/1_thwjkuzt","provider":"Cornell Health","detail":"With the heel supported, turn the forefoot outward against a band, then return slowly.","gear":["band","seat"],"cue":"Keep the knee still. Do not let the band snap the foot back.","rest":"30–45 sec","regression":"Use a lighter band and a smaller comfortable range.","progression":"Increase resistance only when both directions remain smooth and the next morning is unchanged.","video_access":"Public demonstration; no paid exercise-library subscription required."},"copen":{"id":"copen","title":"Copenhagen hold","url":"https://vimeo.com/647984927","provider":"E3 Rehab","detail":"Use the Copenhagen support position you already completed comfortably in Weeks 9–12. Keep your hips and ribs aligned and breathe during the hold. Knee support remains a valid option.","gear":["bench","mat"],"cue":"No assumption that finishing 12 weeks means the longest lever is safe. Keep the familiar lever and breathe; groin/knee pain stops the set.","rest":"45–60 sec","regression":"Keep the lower foot on the floor to assist, or shorten the hold.","progression":"Retain the lever you already tolerate. Build hold time or controlled lowering, then lengthen the lever a little, never all at once.","form_note":"Use the support position and lever you already tolerate. This is a static hold, not repeated hip lifts.","video_access":"Public demonstration; no paid exercise-library subscription required."},"carry":{"id":"carry","title":"Suitcase carry","url":"https://www.youtube.com/watch?v=IAa-5uP7tSY","provider":"E3 Rehab","detail":"Walk with one dumbbell at your side. Keep your ribs over your pelvis, breathe normally and stay upright. Switch hands.","gear":["db","walkway","support"],"cue":"Retain one Friday suitcase slot. Choose a load allowing a level torso and normal steps; prior back/thigh/trap symptoms stop the set.","rest":"60–90 sec between paired sides","regression":"Use a lighter weight or a shorter distance. Skip while walking itself provokes sharp pain.","progression":"Once both sides are steady for the full distance twice, increase the smallest load step and return to the shorter distance. No automatic return to 45 lb.","video_access":"Public demonstration; no paid exercise-library subscription required."},"rdl":{"id":"rdl","title":"Supported single-leg RDL","url":"https://vimeo.com/703009907","provider":"APEC","detail":"Hold a stable rail lightly. Hinge on one leg while the other leg moves backward. Keep your pelvis facing the floor.","gear":["wall","db","support"],"cue":"Soft standing knee; move from the hip. Do not twist or arch your back.","rest":"60–90 sec","regression":"Use bodyweight and a shorter hinge.","progression":"First improve control and range. Then add the smallest dumbbell increase.","form_note":"Keep one hand on a stable support. The demonstrator’s weight is not your prescribed load.","video_access":"Public demonstration; no paid exercise-library subscription required."},"lunge":{"id":"lunge","title":"Lateral lunge to box","url":"https://vimeo.com/545603684","provider":"KineticSMP","detail":"Use a wide stance with a stable box behind you. Bend one knee and sit the hips back toward the box while the opposite leg stays long; return to center.","gear":["box","support"],"cue":"Shallow range first. No planted-foot twisting or needle-like knee pain.","rest":"60–90 sec","regression":"Use bodyweight, a higher box and hand support. Skip if knee pain persists.","progression":"Add range before adding weight. Keep the same box and load when other training increases.","form_note":"Use a stationary wide stance and sit back toward the box. No extra step or jump is needed; the goblet weight is optional only within your prescribed loading.","video_access":"Public demonstration; no paid exercise-library subscription required."},"er":{"id":"er","title":"External rotation at 45°","url":"https://www.cornell.edu/video/shoulder-external-rotation-45-degrees","provider":"Cornell Health","detail":"Support the upper arm slightly away from your side, elbow bent. Rotate the forearm outward slowly against a light band.","gear":["band","seat"],"cue":"Keep the upper arm supported at a comfortable angle, up to the previously tolerated 45°. Return beside the ribs if this position pinches.","rest":"30–45 sec","regression":"Return to elbow-by-side external rotation with a lighter band.","progression":"Keep the pre-workout set easy. Progress only the post-workout set after two calm exposures.","form_note":"Keep the upper arm supported at roughly 45° away from your torso, not shoulder-height 90/90.","video_access":"Public demonstration; no paid exercise-library subscription required."},"slide":{"id":"slide","title":"Serratus wall slide","url":"https://vimeo.com/956259250","provider":"E3 Rehab","detail":"Place forearms on a wall and slide upward while gently pushing into the wall. Stay within a comfortable shoulder range.","gear":["wall"],"cue":"Ribs stay down; do not arch the lower back or shrug hard.","rest":"30 sec","regression":"Shorten the upward range.","progression":"This remains an easy warm-up, not an endurance test.","video_access":"Public demonstration; no paid exercise-library subscription required."},"plus":{"id":"plus","title":"Serratus push-up plus","url":"https://www.cornell.edu/video/push-up-plus-on-table","provider":"Cornell Health","detail":"Use a stable bench or table. Keep elbows straight and gently push your chest away by moving the shoulder blades around the ribs.","gear":["bench"],"cue":"No low-back sag or painful shoulder collapse.","rest":"30–45 sec","regression":"Use a wall or return to wall slides.","progression":"Lower the incline only after two symptom-free sessions. Do not add reps at the same time.","form_note":"Use the shoulder-blade “plus” action at your tolerated incline. This is not an additional full push-up workout.","video_access":"Public demonstration; no paid exercise-library subscription required."},"pallof":{"id":"pallof","title":"Split-stance Pallof press","url":"https://www.youtube.com/watch?v=qxgj5S2M7FA","provider":"Garrett McLaughlin","detail":"Stand side-on to an anchored band with one foot slightly forward. Press your hands out, pause, and return without turning your torso.","gear":["band","anchor","support"],"cue":"Keep a shallow, comfortable stance and keep breathing.","rest":"45–60 sec","regression":"Use parallel feet or lighter resistance if the staggered stance irritates the knee.","progression":"Increase resistance only after the top rep count is controlled twice.","form_note":"Keep the staggered stance shallow and comfortable. Resist turning rather than rotating with the band.","video_access":"Public demonstration; no paid exercise-library subscription required."},"neck":{"id":"neck","title":"Neck isometrics","url":"https://www.youtube.com/watch?v=65g5fshTPRQ","provider":"Donald Corenman, MD","detail":"Sit upright. Press your forehead, back of head, then each side gently into your hand without moving the head.","gear":["seat"],"cue":"About 20–30% effort. No bridges, harness, partner resistance or breath-holding.","rest":"10–15 sec between holds","regression":"Use shorter, gentler holds. Stop for headache, dizziness, numbness or radiating pain.","progression":"Hold time may increase to 15 seconds. More force is not the goal; clinical review before heavier neck training.","video_access":"Public demonstration; no paid exercise-library subscription required."},"wrist":{"id":"wrist","title":"Wrist extension","url":"https://vimeo.com/861439409","provider":"E3 Rehab","detail":"Support your forearm on a bench with the palm down and hand beyond the edge. Slowly raise and lower a light dumbbell at the wrist.","gear":["seat","lightdb"],"cue":"No thumb-joint pain or elbow flare. Keep the forearm supported.","rest":"30–45 sec","regression":"Use no added weight or shorter comfortable range.","progression":"Add reps before the smallest load increase. Skip extra grip work: your rows and carries already supply it.","video_access":"Public demonstration; no paid exercise-library subscription required."},"balance":{"id":"balance","title":"Balance with head turns","url":"https://www.youtube.com/watch?v=XIzzy_BTkVE","provider":"Travis Tarrant","detail":"Stand on one leg near support. Slowly look left and right while keeping your chest and hips facing forward.","gear":["wall","support"],"cue":"Firm floor, eyes open, fingertip support if needed.","rest":"20–30 sec","regression":"Use both feet or hold a steady single-leg stance without head turns.","progression":"Reduce hand assistance before adding speed. No unstable surface or eyes-closed progression.","form_note":"Use a flat, stable floor near support. Turn the head slowly left and right. Do not add the tiptoe or pillow variations.","video_access":"Public demonstration; no paid exercise-library subscription required."},"reach":{"id":"reach","title":"Three-direction balance reach","url":"https://www.youtube.com/watch?v=8qbYiiNyoNg","provider":"Peak Physio","detail":"Stand on one leg and reach the free foot a small distance forward, diagonally forward and to its own side. Return to center after each reach.","gear":["wall","support"],"cue":"Pelvis level; no twisting the standing knee.","rest":"20–30 sec","regression":"Use fingertip support and shorter reaches.","progression":"Improve steadiness rather than chasing maximum reach distance.","form_note":"Only small forward, forward-diagonal and sideways reaches. Skip backward reaches and maximum-distance attempts.","video_access":"Public demonstration; no paid exercise-library subscription required."},"hip":{"id":"hip","title":"90/90 hip rotations with hand support","url":"https://www.youtube.com/watch?v=Lx07WIkllbA","provider":"E3 Rehab","detail":"Sit with hands behind you and both knees bent. Gently move the knees from one side toward the other through a comfortable range.","gear":["mat"],"cue":"Do not force either knee down. This is easy mobility, not a deep stretch test.","rest":"20–30 sec","regression":"Use a smaller range or omit if your knee or back objects.","progression":"Only reduce hand support after the movement feels easy. No weighted stretching.","video_access":"Public demonstration; no paid exercise-library subscription required."},"step":{"id":"step","title":"Forward step-to-stick","url":"https://www.cornell.edu/video/forward-step-tos","provider":"Cornell Health","detail":"Take a short forward step onto one leg, settle your balance for 2 seconds, then reset. Alternate sides.","gear":["wall","support"],"cue":"Step, do not jump. No rushing or twisting.","rest":"20–30 sec","regression":"Take a shorter step with fingertip support.","progression":"Make the landing quiet and steady before progressing to jumping.","form_note":"Take a controlled step, transfer weight and pause. Do not hop.","video_access":"Public demonstration; no paid exercise-library subscription required."},"jump":{"id":"jump","title":"Jump-to-stick","url":"https://vimeo.com/665273054","provider":"Smooth Training","detail":"Make a small two-foot vertical jump, land softly and hold your position for 2 seconds. Reset fully between repetitions.","gear":["floor","support"],"cue":"Submaximal height. Stop when landings get noisy, uneven or painful.","rest":"60–90 sec","regression":"Return to forward step-to-stick.","progression":"Increase consistency first. Do not add load, box height or repeated rebound jumps.","form_note":"Use a low, submaximal jump and pause at the landing.","video_access":"Public demonstration; no paid exercise-library subscription required."},"bound":{"id":"bound","title":"Lateral bound-to-stick","url":"https://vimeo.com/149901107","provider":"Reach Your Potential Training","detail":"Push gently sideways from one leg to the other. Hold the landing for 2 seconds, then reset before the next repetition.","gear":["floor","support"],"cue":"Small distance. No rapid skater jumps, forced pivots or unstable landing.","rest":"60–90 sec","regression":"Use a small sideways step and hold instead.","progression":"Only after two calm two-foot jumping sessions and comfortable single-leg control.","form_note":"Use a small distance and hold the landing. Do not copy maximal athletic bounds.","video_access":"Public demonstration; no paid exercise-library subscription required."},"footwork":{"id":"footwork","title":"Shadowboxing footwork","url":"https://www.youtube.com/watch?v=zhWfajP4EVU","provider":"Tony Jeffries","detail":"Use small forward, backward and sideways steps while keeping your boxing stance. Add only light straight shadow punches.","gear":["floor","support"],"cue":"No hard pivots, bouncing conditioning or maximal punches.","rest":"45–60 sec between rounds","regression":"Use shorter rounds or standing light shadow punches with no stepping.","progression":"Build round time before speed. A boxing coach should review stance; other martial arts use different stances.","form_note":"Use the beginner stepping section. Skip advanced pivots until your coach has checked foot and knee tolerance.","video_access":"Public demonstration; no paid exercise-library subscription required."},"rope":{"id":"rope","title":"Jump rope · basic bounce / boxer step","url":"https://www.youtube.com/watch?v=xOk9UnkiWAo","provider":"Tony Jeffries","detail":"Use a light basic rope and tiny two-foot bounces. Relax the shoulders and turn the rope with your wrists. Stop well before fatigue changes the landing.","gear":["rope","floor","support"],"cue":"Use a light rope and low, quiet jumps. Work intervals exclude rest. Stop for forefoot pain, knee jabs, altered landing or loss of rhythm.","rest":"40–60 sec walking between intervals","regression":"Use the bike-only track if landing or toe push-off hurts.","progression":"Basic bounce → alternating feet / boxer step → longer repeatable rounds. Two comfortable exposures before increasing work. No compulsory double-unders, weighted rope or hour-long skipping.","form_note":"Tony Jeffries demonstrates several variations. Use basic bounce first; add a few boxer-step repetitions within an existing interval rather than adding more intervals.","video_access":"Public demonstration; no paid exercise-library subscription required."},"run":{"id":"run","title":"Run / walk","url":"https://www.youtube.com/watch?v=EWTGTO79h5A","provider":"Mayo Clinic","detail":"Alternate your familiar easy jog and walk. Use a comfortable self-selected speed on level ground or a treadmill at 0% incline.","gear":["cardio","support"],"cue":"Keep the same pace and duration while strength, classes or rope exposure changes.","rest":"Walk intervals are built in","regression":"Repeat a lower previously comfortable rung or use painless cycling.","progression":"This plan deliberately holds the run/walk dose rather than increasing it weekly.","form_note":"Follow the run/walk intervals on this card. The reference explains the approach; it does not replace your scheduled dose.","video_access":"Public demonstration; no paid exercise-library subscription required."},"bike":{"id":"bike","title":"Easy stationary bike","url":"https://www.healthwise.net/DukeHealth/Content/StdDocument.aspx?DOCHWID=acd9356","provider":"Duke Health / Healthwise","detail":"Adjust the seat so the knee is still slightly bent at the bottom of the pedal stroke. Pedal seated at an easy conversational effort.","gear":["bike"],"cue":"No hard intervals or standing pedaling. Stop if knee or foot pain increases.","rest":"Continuous easy effort","regression":"Shorten the session; if pedaling is painful, stop rather than force it.","progression":"Keep this easy. This replaces Sunday running on the rope or low-impact track.","form_note":"Use the setup demonstration and your card’s easy dose. It does not diagnose or clear knee pain.","video_access":"Public demonstration; no paid exercise-library subscription required."},"dead":{"id":"dead","title":"Dead bug isometric","url":"https://vimeo.com/730111148","provider":"E3 Rehab","detail":"Lie on your back with hips and knees bent, arms comfortably forward. Gently brace and breathe while keeping your back comfortable.","gear":["mat"],"cue":"No breath-holding, forced back flattening or leg-radiation symptoms.","rest":"30–45 sec","regression":"Rest arms down or keep one foot on the floor.","progression":"Extend one arm or leg slightly only after the short position is easy twice.","form_note":"Hold the dead-bug position for the prescribed time. Do not substitute repeated arm/leg movements.","video_access":"Public demonstration; no paid exercise-library subscription required."},"side":{"id":"side","title":"Side plank","url":"https://vimeo.com/647930208","provider":"E3 Rehab","detail":"Support yourself on a forearm with knees bent or legs straight. Hold hips and ribs in a steady line.","gear":["mat"],"cue":"End before sagging, shoulder pain or back pain.","rest":"30–45 sec","regression":"Use bent knees and a shorter hold.","progression":"Use the longer lever only after comfortable holds. Do not chase multi-minute planks.","video_access":"Public demonstration; no paid exercise-library subscription required."},"bear":{"id":"bear","title":"Bear crawl · forward and backward","url":"https://www.youtube.com/watch?v=sdjX_Jdzgcg","provider":"Girls Gone Strong","detail":"Lift knees just off the floor. Take small opposite-hand/opposite-foot steps forward, then return backward. Keep the trunk quiet.","gear":["mat","floor"],"cue":"Present from Block 1. Small controlled opposite-hand/foot steps. This replaces old Sunday core/crawl work; do not double it.","rest":"45–60 sec","regression":"Use the dead bug isometric instead.","progression":"Add a little distance while keeping movement slow. No neck bridges or explosive sprawls.","form_note":"Use forward and backward steps only. Keep the distance and dose on this card.","video_access":"Public demonstration; no paid exercise-library subscription required."},"cableRotation":{"id":"cableRotation","title":"Standing cable rotation","url":"https://vimeo.com/1210022641","provider":"Justin Brink · public Vimeo demonstration","detail":"Stand side-on to a chest-height cable. Hold the handle or rope with both hands. Turn through a comfortable range with the hips and chest coordinated, allowing the feet to follow without forcing a planted knee. Control the return.","gear":["cable"],"cue":"This IS Mike’s Friday cable-rotation slot, counted once. Keep a secure grip, light-to-moderate resistance and a quiet weight stack. No ball release, cable yanking or forced end-range twist.","rest":"60–90 sec","regression":"Reduce range and load. If rotation reproduces knee, back or radiating symptoms, omit it and review the slot with Mike; do not substitute a weighted-ball swing.","progression":"First make both directions smooth at the same load. Build 6 → 7 → 8 controlled repetitions; then add the smallest load and return to 6. Later use the split-stance version only after Mike checks it. Change one variable at a time.","form_note":"Replaces the previous rotational ball toss because your padded ball is not to be thrown or slammed. Cable strength/control is not identical to free-release throwing power. The program retains jumps and pop push-ups for explosive work. Use this card’s dose, not the video’s general programming.","video_access":"Public Vimeo demonstration; no paid exercise-library subscription required."},"ball":{"id":"ball","title":"Optional massage-ball reset","url":"https://www.youtube.com/watch?v=un-PIOLAJU8","provider":"Orange County Physical Therapy","detail":"Place a massage ball between the glute muscle and a wall. Lean gently and move a little, without grinding into a painful point.","gear":["ball","wall"],"cue":"Comfort only. Avoid spine, joints, painful foot structures and radiating symptoms.","rest":"Not applicable","regression":"Skip it. No recovery tool is compulsory.","progression":"Do not increase pressure to chase soreness.","form_note":"Use light, comfortable pressure on the glute muscle, not deep pressure into a painful spot.","video_access":"Public demonstration; no paid exercise-library subscription required."},"theragun":{"id":"theragun","title":"Optional Theragun calf reset","url":"https://www.youtube.com/watch?v=YIW4lW7Wvec","provider":"Therabody","detail":"Use a soft attachment at low intensity over the calf muscle belly. Keep the device moving lightly.","gear":["theragun"],"cue":"No use directly over bones, tendons, bruises, swelling, numb skin or an unexplained painful calf.","rest":"Not applicable","regression":"Skip it.","progression":"Comfort tool only; not a way to repair tendons or make an unsafe exercise safe.","video_access":"Public demonstration; no paid exercise-library subscription required."},"castle":{"id":"castle","title":"Optional CastleFlexx recovery","url":"https://www.youtube.com/watch?v=D_ipVSS1kCw","provider":"CastleFlexx","detail":"Use your familiar heel-supported gentle calf/hamstring stretch. Keep the spine comfortable and stop well before a strong stretch.","gear":["castle"],"cue":"No forced big-toe extension, nerve-like tingling or end-range pulling.","rest":"Not applicable","regression":"Skip it or use the already comfortable mobility prescribed by Mike.","progression":"No new stretch range on a recovery day.","form_note":"Use the public Getting Started demonstration for device setup. Keep your familiar gentle stretch and the short dose on this card, rather than completing the full flow.","video_access":"Public demonstration; no paid exercise-library subscription required."},"hipabd":{"id":"hipabd","title":"Side-lying hip abduction","url":"https://www.youtube.com/watch?v=EwBJKBa4PKU","provider":"Ask Doctor Jo","detail":"Lie on your side with the lower knee bent and the top leg straight. Raise the top leg a modest distance without rolling your pelvis backward; lower slowly.","gear":["mat","mini"],"cue":"Feel the outer hip working. Keep your pelvis still; do not lift higher by bending your waist. Use bodyweight if resistance changes your form.","rest":"45–60 sec between sets","regression":"Use no band and a smaller comfortable range. Support your head so your neck stays relaxed.","progression":"Keep your already comfortable starting level. Build from 10 to 15 controlled reps, then add a light mini-band above the knees and return to 10. Two calm exposures before changing one variable.","form_note":"Bodyweight is sufficient initially. A mini-band above the knees is an optional loading progression already described in your plan.","video_access":"Public demonstration; no paid exercise-library subscription required."},"bandwalk":{"id":"bandwalk","title":"Glute-band lateral walk","url":"https://www.youtube.com/watch?v=y_bqFDQZSHQ","provider":"FIT.nl","detail":"Place a light mini-band just above your knees. Take small sideways steps with softly bent knees, keeping your pelvis level and both feet facing generally forward.","gear":["mini","support"],"cue":"Use light tension on Wednesday. Do not sink into a deep squat or grip with your toes. This is a second hip-abductor exposure, not a leg finisher.","rest":"30–45 sec between sets","regression":"Use a lighter band, fewer steps, or side-lying hip abduction without a band if weight-bearing is uncomfortable.","progression":"Build from 8 to 12 steps each way. Keep Wednesday easy; progress resistance only when Friday and the next morning stay calm.","form_note":"Keep the band above the knees for this plan and use small, controlled steps with a comfortable knee bend.","video_access":"Public demonstration; no paid exercise-library subscription required."},"stepdown":{"id":"stepdown","title":"Supported lateral step-down","url":"https://vimeo.com/647952200","provider":"E3 Rehab","detail":"Stand on a low, flat step beside a rail. Bend the standing knee and hip slowly, lightly tap the opposite heel to the floor, then rise without pushing off the tapping foot.","gear":["step","wall","support"],"cue":"Use a flat platform, not the slant board. Keep the whole standing foot supported, pelvis level and knee following the toes. Stop for a needle-like knee jab.","rest":"45–60 sec between sets","regression":"Use a lower step, a smaller lowering range and more hand support. Skip it if sharp pain occurs rather than testing repeatedly.","progression":"Wednesday is one easy control set only. A coach-approved Friday replacement can use 2 × 6–8 per leg. Improve control before height or load; do not increase all three.","form_note":"Use a low flat step with light hand support. Do not use the slant board or copy a challenging step height.","video_access":"Public demonstration; no paid exercise-library subscription required."},"ballroll":{"id":"ballroll","title":"Kneeling stability-ball rollout","url":"https://www.youtube.com/watch?v=Vzh4IiEE_jU","provider":"Movement As Medicine","detail":"Kneel on a mat with forearms on the ball. Roll forward from the shoulders and hips together, stopping before your lower back arches. Pull back under control.","gear":["stability","mat"],"cue":"A short, controlled reach is useful work. Keep breathing; this replaces one core exercise, not an extra ab circuit.","rest":"45–60 sec","regression":"Dead bug, or a shorter ball rollout.","progression":"Reach slightly farther with the same repetitions. Progress to a kneeling wheel only after this is comfortable and controlled.","form_note":"Use the large inflatable stability ball, not the padded weighted medicine ball. These are different tools with different roles.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"abwheel":{"id":"abwheel","title":"Kneeling ab-wheel rollout","url":"https://vimeo.com/730109469","provider":"E3 Rehab","detail":"Kneel on a pad. Start with a wall limiting the wheel’s travel. Roll out only as far as you can keep your ribs and pelvis controlled, then return without arching.","gear":["wheel","mat","wall"],"cue":"No standing rollouts or forced end range. Stop with 2–3 technically clean repetitions still available.","rest":"60–90 sec","regression":"Shorter wall-limited reach or stability-ball rollout.","progression":"Mark your reach distance. Add a few centimetres only after two comfortable sessions; do not add distance and repetitions together.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"trxham":{"id":"trxham","title":"TRX hamstring curl","url":"https://www.youtube.com/watch?v=RkEHyudfkyM","provider":"TRX Training","detail":"With the suspension anchor secure, lie on your back with heels in the cradles. Lift into a comfortable hip bridge, curl the heels toward you, then extend slowly.","gear":["trx","mat"],"cue":"This occupies the existing hamstring-curl slot. Keep the low back comfortable; no exaggerated bridge.","rest":"60–90 sec","regression":"Mike’s familiar seated/lying hamstring curl, or shorter-range bilateral TRX curls.","progression":"Two-leg curls → longer controlled extension → assisted single-leg lowering only after coach review. Resistance and leverage progress separately.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"trxrow":{"id":"trxrow","title":"TRX low row","url":"https://www.youtube.com/watch?v=NWgHtiJjDz0","provider":"TRX Training","detail":"Face the secure anchor, lean back with a straight body, and row your chest toward the handles. Lower slowly while keeping the shoulder comfortable.","gear":["trx"],"cue":"An alternative to one existing row, not another pulling finisher. Keep the handles and straps intact and the anchor rated for body weight.","rest":"60–90 sec","regression":"More upright body angle or Mike’s familiar supported row.","progression":"Increase the lean a little before changing repetitions. Do not add a towel or unstable grip until the basic row is solid.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"bagcarry":{"id":"bagcarry","title":"Handled core-bag bear-hug carry","url":"https://www.youtube.com/watch?v=I5lBikIB7tI","provider":"Michael Jordan PT","detail":"Use the handles to lift a manageable core bag from a stable bench or raised start, then hug the body of the bag close to your torso. Walk in short, controlled steps while breathing, and place the bag down deliberately.","gear":["bag","walkway"],"cue":"Check the handles and seams first. Keep handles and straps clear of your face and legs. Hug the bag body rather than dangling it by the handles like a farmer carry. No slams, throws or drops.","rest":"60–90 sec","regression":"Use a lighter handled bag or a short stationary bear-hug hold. A comfortably gripped padded medicine ball can replace the bag for the same carry dose; it stays in your arms and is placed down gently.","progression":"Keep your familiar 20 → 25 → 30 m progression. After two comfortable exposures, add a small load and return to the shorter lane. Add controlled floor pickups only after learning them; do not also add distance and rounds.","form_note":"The video uses a soft sandbag to show the bear-hug carry. With your Life Fitness-style handled core bag, use its handles for pickup, hug the bag body for walking, and avoid pressing rigid seams into your ribs. Its DO NOT SLAM label remains in force. The optional held-ball version is linked below.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video.","alternative_links":[{"label":"Optional substitute: medicine-ball carry · CrossFit (YouTube)","url":"https://www.youtube.com/watch?v=RwdAZjeKYGs"}]},"bagdead":{"id":"bagdead","title":"Handled core-bag deadlift","url":"https://www.youtube.com/watch?v=bumY6R9NSmY","provider":"Tom Pfeiffer Fitness","detail":"With a manageable core bag between your feet, grasp both intended lifting handles. Hinge and bend the knees, stand with the bag close, then lower it with control until it rests on the floor or raised start.","gear":["bag"],"cue":"Both hands stay on the handles. This is light pickup practice, not a max-strength deadlift or a clean. No twisting, slamming, dropping or jerking the bag.","rest":"60–90 sec","regression":"Start the bag on a raised stable surface or use a familiar kettlebell deadlift with Mike.","progression":"Improve comfortable range before load. A two-hand clean to front rack is a separate coach-checked skill, not the next automatic repetition.","form_note":"Use only intact, secure handles and a bag whose weight you can set down gently. Do not imitate a soft sandbag drop or shoulder toss.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"bagclean":{"id":"bagclean","title":"Handled core-bag clean to front rack","url":"https://vimeo.com/191792276/30295dc5d8","provider":"EVO Fitness · public Vimeo tutorial","detail":"After coaching, begin with a light handled bag at the hips and both hands on the neutral-grip handles. Use a small hinge and hip drive, guide the bag close, and bring the elbows underneath into a supported front-rack position. Stand tall, then lower under control.","gear":["bag","floor"],"cue":"Optional from Block 5 only after Mike checks this bag and your technique. One two-hand clean is one total rep, not one rep per side. No shoulder toss, overhead press, release, slam or drop.","rest":"90–120 sec","regression":"Use the familiar handled core-bag bear-hug carry instead. Owning a handled bag does not establish readiness for cleans.","progression":"Practice three light, separate repetitions with a reset between them. Improve front-rack comfort and controlled lowering before any small load increase. The clean replaces the bag-carry block; it is not another finisher.","form_note":"This reference uses a core bag with handles and a two-hand front-rack catch, replacing the earlier soft-sandbag-to-one-shoulder video. Use the designated handles and manufacturer-approved use. EVO’s free companion tutorial is linked below. Previous clean selections reset to carry in this equipment revision until the new movement has been checked.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video.","alternative_links":[{"label":"Free written + video tutorial: core bag clean · EVO Fitness","url":"https://evofitness.at/en/blog/learn/core-bag-clean/"}]},"popPushUp":{"id":"popPushUp","title":"Incline plyometric push-up","url":"https://www.youtube.com/watch?v=INfoyOtxiBU","provider":"Dr. Jacob Goodin · YouTube","detail":"Place your hands on a wide, immovable bench or platform. Lower under control, push briskly so the hands briefly leave the surface, then receive the landing with soft elbows. Reset your body line before each repetition.","gear":["bench","floor"],"cue":"This relocates your existing pop-push-up slot to Tuesday before bench work. Do not repeat it on Sunday or add another power-press circuit. No clap or depth drop; stop if shoulder, wrist or toe symptoms appear.","rest":"60–90 sec, longer if speed or control is not back","regression":"Use a higher secure surface and a brisk incline push-up without hand lift-off, or omit this power slot while retaining Mike’s comfortable main pressing work.","progression":"Keep three crisp repetitions per set. First improve consistent takeoff and soft landing; then, with Mike, slightly lower the support. Do not lower the incline and add sets in the same week. Stop well before fatigue.","form_note":"Replaces the medicine-ball chest pass: no throwing ball is needed. Start from your already comfortable pop-push-up level, using an incline when needed. A stable high bench is preferable to forcing a floor variation. The plyometric slot is separate from the easy serratus/scapular preparation.","video_access":"Public YouTube demonstration; no paid exercise-library subscription required."},"splitCableRotation":{"id":"splitCableRotation","title":"Split-stance cable rotation","url":"https://www.youtube.com/watch?v=VH7fUjHUx64","provider":"Pro Level Performance & Physio · YouTube","detail":"Use a comfortable staggered stance beside the cable with both hands on the rope or handle. Rotate through a small, controlled range without leaning or arching. Return slowly and reset before each repetition.","gear":["cable"],"cue":"The same Friday rotation slot, not extra sets. No step-behind, crossover or hard twist over a planted knee. A staggered stance is optional; keep the standing version if it is better tolerated.","rest":"60–90 sec","regression":"Standing cable rotation with less resistance and a smaller range. Omit if rotation provokes sharp knee or radiating back/leg symptoms.","progression":"Maintain the achieved load and range when first changing stance. Progress repetitions, then a small load increase. A purposeful concentric is fine only while both the cable and return stay controlled; never jerk the stack.","form_note":"The reference demonstrates a staggered-stance rope rotation. Copy the setup only within your comfortable range. Have Mike check the stance and feet; do not force a fixed-foot rotation to match a video. This replaces the earlier step-behind ball-throw progression, not the main squat.","video_access":"Public YouTube demonstration; use the card’s dose, not a full video workout."},"bearlat":{"id":"bearlat","title":"Lateral bear crawl","url":"https://www.youtube.com/watch?v=he1k9F-P4DI","provider":"Well+Good · Kat Atienza","detail":"Hover the knees just off the mat. Move sideways in small opposite-hand/foot steps while keeping the trunk quiet. Change direction without rushing.","gear":["mat","floor"],"cue":"No speed contest. Stop before shoulder shrugging, painful wrist pressure or toe pain changes the movement.","rest":"45–60 sec","regression":"Forward/backward crawl over less distance, or dead bug if ground support is painful.","progression":"Add a little distance, then link forward, backward and lateral travel. Keep the same total work when adding a new direction.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"standup":{"id":"standup","title":"Technical stand-up · solo practice","url":"https://www.youtube.com/watch?v=0XLhnHPVDVo","provider":"Knight Jiu-Jitsu","detail":"From sitting on a mat, use the opposite hand and foot as a base, keep the free hand up, bring the free leg back, and rise to a balanced stance. Practice slowly on both sides.","gear":["mat","floor"],"cue":"Get the support position checked in class. No partner, kicking, fall or fast sprawl is prescribed. Stop for wrist, shoulder or knee pain.","rest":"30–45 sec","regression":"A controlled half-kneeling-to-standing transfer using support, or omit painful floor transitions.","progression":"Link controlled standing and returning to the mat, then add a slow stance reset. This is movement familiarity, not self-defence certification.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"shuffle":{"id":"shuffle","title":"Lateral shuffle to controlled stop","url":"https://www.youtube.com/watch?v=9S-4Ukel4tU","provider":"University of Denver Sports Performance","detail":"Shuffle two or three metres sideways, lower the hips slightly and stop in a balanced stance. Return the other way after resetting.","gear":["floor"],"cue":"Keep feet from crossing. Use short steps to turn. No maximal cut or planted-foot pivot through knee pain.","rest":"45–60 sec","regression":"Shorter, slower shuffles or the last comfortable footwork drill.","progression":"Planned direction → left/right voice cue → short repeat bouts. Increase decision demand before trying higher speed.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"swing":{"id":"swing","title":"Two-hand kettlebell swing","url":"https://www.youtube.com/watch?v=yHxcTn1UeAc","provider":"StrongFirst","detail":"Use a hinge learned with your coach. Hike the bell back, drive the hips and allow it to float around chest height, then absorb the return with the hips.","gear":["kb","floor"],"cue":"An optional replacement for the bag-power slot, never added after it. No overhead swings or lifting the bell with the shoulders.","rest":"60–90 sec","regression":"Coach-guided kettlebell deadlift, or the familiar bag carry.","progression":"Only after your hinge is checked: repeat short powerful sets, then add the smallest sensible load. Stop if your back or leg symptoms return.","form_note":"Use a proper kettlebell for this option, never the handled core bag or padded medicine ball. The bag and ball are not released or dropped.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"broad":{"id":"broad","title":"Broad jump to stick","url":"https://catalystathletics.com/exercise/549/Broad-Jump/","provider":"Catalyst Athletics","detail":"From two feet, jump a modest distance forward and hold a quiet, balanced landing. Reset fully, then repeat.","gear":["floor","support"],"cue":"Use your previously comfortable distance, not a maximal leap. These replace Sunday jump-squat/rabbit work.","rest":"60–90 sec","regression":"Shorter bilateral jump; use step-to-stick only as a symptom/return regression.","progression":"Record consistent distance and landing quality. Progress to linked submaximal jumps only after controlled single jumps and a normal next morning.","form_note":"The reference shows a broad jump; your first dose is submaximal. Follow this card’s volume rather than the weightlifting article’s set range.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"boxjump":{"id":"boxjump","title":"Box jump · step down","url":"https://www.nsca.com/education/videos/bridge-series/bridge-jump-landing-for-females/","provider":"NSCA","detail":"Jump onto a low, stable box with both feet. Land quietly with room for both feet, stand, then STEP down and reset.","gear":["box","support"],"cue":"This is the existing Friday jump slot, counted once. Do not add extra box or single-leg step-up jumps after it.","rest":"75–120 sec","regression":"Lower box or familiar low bilateral jump; no jump during first-week travel return.","progression":"Improve takeoff speed and landing consistency before box height. High boxes are not a required progression.","form_note":"The free NSCA demonstration teaches landing mechanics. Its title names a female-focused program; these are not sex-specific instructions or a separate prescription.","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"stepjump":{"id":"stepjump","title":"Step-up jump","url":"https://www.youtube.com/watch?v=d6XOrNwKOHo","provider":"Champion Physical Therapy and Performance","detail":"Place one foot on a low stable box. Drive through that leg into a small jump, land under control, and reset. Repeat on the other side.","gear":["box","support"],"cue":"This replaces the box-jump slot, not another jump exercise after it. Use a height and technique already checked with Mike.","rest":"75–120 sec","regression":"Your familiar bilateral low box jump, or no impact during a flare or first return week.","progression":"Improve control and quick force production on each side. Add repetitions before a modest height change; no loaded or maximal-height jumps.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"hiphook":{"id":"hiphook","title":"Aletha Hip Hook · optional comfort","url":"https://alethahealth.com/pages/howto-hip-hook-mark","provider":"Aletha Health · official instructions and videos","detail":"Use only the manufacturer’s demonstrated positions, with the guidance of your healthcare practitioner. This is an optional comfort tool, not strength work or a requirement to train.","gear":["hiphook"],"cue":"Stop for discomfort, numbness, tingling, throbbing or radiating symptoms. No improvised pressure into the front/side of the neck, groin or abdomen.","rest":"No training rest needed","regression":"Skip the tool; comfortable normal movement is enough.","progression":"There is no strength progression for passive release. Follow the product safety information, not a stronger-pressure target.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"range":{"id":"range","title":"Aletha Range · optional comfort","url":"https://alethahealth.com/pages/howto-range","provider":"Aletha Health · official instructions and videos","detail":"Use only the manufacturer’s demonstrated positions, with the guidance of your healthcare practitioner. This is an optional comfort tool, not strength work or a requirement to train.","gear":["range"],"cue":"Stop for discomfort, numbness, tingling, throbbing or radiating symptoms. No improvised pressure into the front/side of the neck, groin or abdomen.","rest":"No training rest needed","regression":"Skip the tool; comfortable normal movement is enough.","progression":"There is no strength progression for passive release. Follow the product safety information, not a stronger-pressure target.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"orbit":{"id":"orbit","title":"Aletha Orbit · optional glute comfort","url":"https://alethahealth.com/pages/howto-orbit","provider":"Aletha Health · official instructions and videos","detail":"Use only the manufacturer’s demonstrated positions, with the guidance of your healthcare practitioner. This is an optional comfort tool, not strength work or a requirement to train.","gear":["orbit"],"cue":"Stop for discomfort, numbness, tingling, throbbing or radiating symptoms. No improvised pressure into the front/side of the neck, groin or abdomen.","rest":"No training rest needed","regression":"Skip the tool; comfortable normal movement is enough.","progression":"There is no strength progression for passive release. Follow the product safety information, not a stronger-pressure target.","form_note":"","video_access":"Public instructional reference. Follow this card’s dose, not a full workout in the video."},"ballcarry":{"id":"ballcarry","title":"Medicine-ball bear-hug carry · optional substitute","url":"https://www.youtube.com/watch?v=RwdAZjeKYGs","provider":"CrossFit · YouTube","detail":"Lift a manageable padded medicine ball from a stable raised start, cradle it close against your torso with both arms, and walk in short controlled steps. Return it gently to the start with both hands.","gear":["medball","walkway"],"cue":"Optional replacement for the scheduled bag carry, using its distance and sets. No extra rounds, throwing, bouncing, slamming or dropping. If the ball is too large or slippery to hold securely, use the handled bag.","rest":"60–90 sec","regression":"A lighter ball or a short supported standing hold. Do not brace or balance your body on the weighted ball.","progression":"Follow only the existing carry-distance progression. Do not simultaneously increase weight, distance and squeeze effort.","form_note":"This is a held-load option, not a required new exercise. The manufacturer and gym restrictions override demonstrations. Your stated no-throw/no-slam restriction applies throughout this plan.","video_access":"Public YouTube demonstration, linked from CrossFit’s workout resources."}},"sources":[{"title":"ACSM 2026 resistance-training position stand","url":"https://pubmed.ncbi.nlm.nih.gov/41843416/","kind":"Position stand / evidence synthesis","use":"Supports goal-specific strength and power training in healthy adults. It does not validate the doses or injury clearance of this individual companion."},{"title":"NSCA: Plyometric Exercises","url":"https://www.nsca.com/education/articles/kinetic-select/plyometric-exercises/","kind":"Professional strength-and-conditioning guidance","use":"Supports short high-quality sets and accounting for jumping elsewhere. Friday and Sunday use a shared, counted-once power schedule."},{"title":"Kostikiadis et al. 2018: strength and conditioning in MMA","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6090403/","kind":"Small intervention study in experienced MMA athletes","use":"Supports combining strength, power and aerobic qualities. A small trained-athlete trial does not justify copying elite workloads or guarantee fighting skill."},{"title":"Breda et al. 2021: progressive tendon-loading exercise","url":"https://pubmed.ncbi.nlm.nih.gov/33219115/","kind":"Randomized trial in diagnosed patellar tendinopathy","use":"Supports staged loading, progressing toward energy-storage demands. It does not diagnose your lateral-knee pain; massage is not the loading intervention."},{"title":"Beyer et al. 2015: heavy slow resistance and Achilles tendinopathy","url":"https://pubmed.ncbi.nlm.nih.gov/26018970/","kind":"Randomized trial in chronic midportion Achilles tendinopathy","use":"Supports sustained progressive loading as one option in that condition. The calf prescriptions here are general capacity work, not a claim that you have Achilles tendinopathy."},{"title":"Harøy et al. 2019: adductor strengthening","url":"https://pubmed.ncbi.nlm.nih.gov/29891614/","kind":"Cluster randomized trial in male football players","use":"Supports a progressive Copenhagen-based approach in that population. Carryover to grappling is a programming inference, not a guaranteed prevention effect."},{"title":"Chottidao et al. 2022: jump-rope / plyometric training in boxers","url":"https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2022.878527/full","kind":"Small boxing training study","use":"Provides sport-relevant context for rope and plyometric training. Our precise intervals are conservative design choices, not a reproduced or proven optimal protocol."},{"title":"CSCCa / NSCA return-to-training transition guidance","url":"https://www.nsca.com/about-us/position-statements/safe-return-to-training/","kind":"Professional consensus","use":"Supports a reduced transition after inactivity. The two-stage travel overlay is our conservative implementation, not a personalized clearance test."},{"title":"PAASS ankle return-to-sport framework","url":"https://pubmed.ncbi.nlm.nih.gov/34158354/","kind":"Expert consensus","use":"Pain, capacity, confidence, control and performance matter alongside elapsed time. The app does not substitute for an examination."},{"title":"Aletha official safety information","url":"https://alethahealth.com/pages/safety-terms-of-use","kind":"Manufacturer instructions, not independent effectiveness evidence","use":"Use only described placements under appropriate clinical guidance. Hip Hook, Range and Orbit are optional comfort tools; the manufacturer does not establish them as tendon-strengthening interventions."},{"title":"AAOS: sesamoiditis and sesamoid fracture","url":"https://www.orthoinfo.org/diseases--conditions/sesamoiditis/","kind":"Orthopaedic patient guidance","use":"Supports modifying painful forefoot loading. This matters for rope, running and toes-loaded crawling."},{"title":"NHS: Knee pain","url":"https://www.nhs.uk/symptoms/knee-pain/","kind":"Patient safety guidance","use":"Recurrent severe jabs or locking/giving-way are not a normal progression signal; urgent advice for inability to bear weight, marked swelling or a hot/red knee with fever."},{"title":"Life Fitness: Core Bags","url":"https://www.lifefitness.com/en-us/catalog/accessories/functional-training-accessories/core-bags","kind":"Manufacturer equipment information","use":"Confirms handled core-bag construction and controlled lifting use. The photographed DO NOT SLAM label and your reported no-throw ball restriction govern this revision; these are not slam bags."},{"title":"EVO Fitness: Core Bag Clean","url":"https://evofitness.at/en/blog/learn/core-bag-clean/","kind":"Free handled-bag technique tutorial","use":"The two-hand front-rack technique replaces the earlier soft-sandbag shoulder clean. Controlled lowering and a coach check are required; the later optional slot is unchanged."},{"title":"Standing Cable Rotation · Justin Brink","url":"https://vimeo.com/1210022641","kind":"Public exercise demonstration","use":"Form reference for coordinated comfortable cable rotation and a controlled return. This is a retained-load alternative, not proof of equal transfer to a free-release throw."}],"phases":[{"name":"Carry forward + learn new tools","short":"Athletic base","focus":"Continue familiar jumps, bounds, carries and bear crawls. Introduce light handled-bag work and short rope intervals while keeping Friday cable rotation and Tuesday pop-push-up power in counted-once slots.","strength":"Loaded soleus, ankle strength, Copenhagen, hip abductors, suitcase carries and cuff/neck/wrist capacity continue. Ball rollouts begin the longer-lever core track.","skill":"Sunday rope 4 × 20–30 sec; broad jumps + lateral bounds; forward/back bear crawl; handled bear-hug carry. Friday box jumps and cable rotation use existing slots; Tuesday pop push-ups precede the main bench work."},{"name":"Multi-directional control + longer levers","short":"Multi-directional","focus":"Add lateral crawling, alternating-foot rope rhythm and a kneeling ab-wheel introduction while retaining familiar landing control.","strength":"Keep main lifts with Mike. TRX hamstring curls can replace the existing curl; side-lying abduction and Copenhagen remain progressive.","skill":"Rope 5–6 × 30–35 sec. Sideways crawl and planned shuffle-stop. Add slow technical stand-up familiarity on a mat."},{"name":"Rotational strength + linked movement","short":"Rotation + movement","focus":"Transfer force through the feet, hips and trunk. Progress the existing cable-rotation slot to a checked staggered stance while linking familiar jump and footwork directions. No ball throws are programmed.","strength":"Longer wheel reach when ready; stronger calf/adductor/carry work, not more unrelated sets. Tuesday pulling remains one slot, with TRX as an alternative.","skill":"Rope 5–6 × 45–50 sec. Planned shuffle-stop, two controlled jumps in a sequence, crawl/stand-up practice. Bag pickup practice remains submaximal."},{"name":"Reactive movement + loaded control","short":"React + control","focus":"Respond to simple external left/right cues and regain balance, without turning every drill into maximal cutting.","strength":"Maintain main strength while improving bag pickup/carry quality and unilateral pelvic control. Travel return overrides the planned week dose.","skill":"Rope 5–6 × 60–65 sec. Cue-based shuffles and controlled rebound-to-stick. Bear crawls travel in three directions."},{"name":"Repeatable force + grappling work","short":"Repeat efforts","focus":"Repeat short bouts of whole-body work without losing posture. Pair familiar carry/crawl tasks with full recovery; power still comes first.","strength":"A coach-checked handled core-bag front-rack clean or a proper kettlebell swing may replace the bag slot, not add to it. Otherwise progress the bear-hug carry. No bag release or drop.","skill":"Rope 5–6 × 75–80 sec. Planned short athletic rounds, reactive footwork and consistent landings. No head-loaded bridge or unsupervised takedown practice."},{"name":"Sport integration + performance review","short":"Integrate","focus":"Use a compact physical foundation alongside coached sport. Keep measured qualities improving while making room for technique training.","strength":"Maintain proven resistance and select only the accessories still needed alongside classes. Review repeatability, not one-rep maxes.","skill":"Rope 5–6 × 90–100 sec at most when tolerated. Short ground/carry rounds, repeatable pop push-ups, cable control and changes of direction. Week 24 reviews your own baseline; it is not a combat-readiness certificate."}],"coverage":[{"region":"Hip abductors / gluteus medius","basis":"Training target, not a measured weakness diagnosis.","main":"Squats and unilateral movements already provide some hip work, but do not guarantee sufficient direct abductor loading.","companion":"Friday side-lying abduction; Wednesday lateral band walks; Sunday single-leg receiving-leg control. These are direct and movement-based exposures, not just passive hip release.","progress":"10–15 controlled abduction reps, then the smallest resistance increase. Wednesday 8–12 steps each way stays submaximal.","boundary":"No claim that hip weakness caused the recent lateral-knee pain. Keep total accessory time capped."},{"region":"Knee control and quadriceps","basis":"Recorded right patellofemoral pain; separately reported brief outer-knee jabs up to 6–7/10.","main":"Back squat 3 × 5 and Mike’s existing knee-dominant work remain the main strength stimulus.","companion":"Main squats provide progressive knee-extensor loading. Flat step-down/control work stays modest; Sunday jumps/bounds progress direction and speed. Slant-board work is not automatically added.","progress":"Lowering control and comfortable range first; height or external load only later. One control drill, not a stacked circuit.","boundary":"The new lateral pain is not assumed to be patellofemoral pain. Sharp jabs, locking, swelling or giving way stop the provoking work and need assessment."},{"region":"Right forefoot, arch and medial-foot sensitivity","basis":"Recorded right sesamoiditis and plantar-fascia history; user-reported medial arch/navicular/tendon symptoms.","main":"Normal walking and main gym work count toward foot loading.","companion":"Short-foot preparation; Friday loaded soleus and a lighter Wednesday repeat; separate inversion/eversion; rope and landings progressed as faster-load work only when comfortable.","progress":"Use the last tolerated resistance and footwear. Running/rope progress by response, not the calendar.","boundary":"The exact medial-foot structure is not diagnosed here. Do not force toe extension, add barefoot training, or use painful rope/heel raises as treatment."},{"region":"Left ankle and lateral stability","basis":"Recorded prior left ATFL sprain.","main":"Daily walking and existing lower-body work remain part of the load.","companion":"Short-foot preparation; Friday loaded soleus and a lighter Wednesday repeat; separate inversion/eversion; rope and landings progressed as faster-load work only when comfortable.","progress":"Control before range, then resistance. Head turns and reaches stay on a stable floor near support.","boundary":"No eyes-closed, unstable-surface or forced maximal-hop progression. Persistent instability needs review."},{"region":"Adductors, hips and posterior chain","basis":"Preparation for stance, kicking, grappling and changing direction; not a diagnosed new injury.","main":"Squats, existing curls/hinges and coached training cover much of the strength work.","companion":"Friday Copenhagen hold at the already tolerated lever; supported hip rotations. RDL or lateral lunge only in an approved replacement slot.","progress":"Hold time before lever change; range and control before heavier unilateral loading.","boundary":"No extra heavy hinge session and no forced groin stretching. Keep the slant board out of the hip-stability progression."},{"region":"Low back / trunk with prior leg radiation","basis":"Recorded chronic low-back pain with sciatica; reported extension-triggered back-to-front-thigh symptoms.","main":"Monday/Thursday TrainWell rehabilitation; Friday coach-owned cable rotation.","companion":"Friday suitcase carry; Tuesday stability-ball-to-wheel rollout track; Sunday bear crawls and handled core-bag holds/carries. Friday cable rotation remains the coach-owned slot, shown here once rather than replaced by a ball throw.","progress":"Maintain breathing and a comfortable trunk position. Increase one load/distance variable only after two calm exposures.","boundary":"Do not load through radiating pain, new numbness or weakness. No neck bridges, forced backbends or unsupported extension substitutes."},{"region":"Shoulders, scapulae, neck and traps","basis":"Recorded bilateral shoulder impingement and chronic neck/upper-back pain; reported trap flare.","main":"Bench 3 × 5, rows/pulldowns, waiter/farmer carries and coach-owned pop push-ups are counted, not duplicated.","companion":"Easy ER/serratus prep, a short Tuesday incline pop-push-up slot moved from Sunday, moderate neck isometrics and controlled crawls. Bench, rows and existing carries remain counted once.","progress":"Retain the comfortable 45° rotation / incline level already achieved; progress only the work set, not warm-up fatigue.","boundary":"No automatic overhead-carry progression, extra pressing workout, heavy neck harness or head-loaded wrestling bridge."},{"region":"Wrists, forearms and grip","basis":"User-reported thumb/wrist soreness with use; preparation for gripping and ground support.","main":"Pulling and farmer/waiter carries already load grip substantially.","companion":"Supported wrist work plus progressive crawling and bag handling. Main rows and farmer/waiter carries supply heavy grip; no automatic maximal hang or gi-grip finisher.","progress":"Repetitions before small resistance increases; ground support replaces a core slot.","boundary":"No extra maximal hangs, gi-grip finisher, knuckle conditioning or painful thumb loading. Omit wrist work if it reproduces symptoms."},{"region":"Aerobic base, movement skill and impact","basis":"Five requested sports: boxing, kickboxing, wrestling, judo and jujitsu; successful prior block is the user’s starting assumption.","main":"Friday box/step-up jumps and Sunday bodyweight/plyometric work already exist. Their exact doses are not verified.","companion":"Visible Sunday rope, familiar run/walk, dynamic jumps/bounds, shuffles, crawls and bag work. This replaces the prior Sunday conditioning/circuit; later rope increases shorten the run block rather than expanding everything.","progress":"Six explicit blocks progress resistance, range, direction, reaction and repeatability separately. Boxing/Muay Thai, wrestling, judo and BJJ skills, plus Olympic and powerlifting technique, are learned with their coaches.","boundary":"General physical preparation does not replace supervised sport skills, falling practice, sparring progression or medical clearance."},{"region":"Recovery, broader health and training tolerance","basis":"Available records also include metabolic/GI history and ADHD/anxiety. Records and wearable data may be incomplete or historical.","main":"TrainWell remains the main plan. Long logged sessions are not proof of recoverable exercise volume.","companion":"Saturday rest; Monday/Thursday no added strength; lighter weeks every fourth week; travel blackout and a conservative return overlay.","progress":"Use energy, form, symptom recovery and next-morning response. Stop at the time cap rather than adding every optional drill.","boundary":"No claim that this program treats every medical condition. Medication decisions remain with the prescriber; do not chase heart-rate targets if medication alters your response."},{"region":"New equipment and sport-specific preparation","basis":"Equipment access and goals reported by you; no measured strength test or new medical clearance is implied.","main":"Bench and back squat 3 × 5, existing rows/curls, carries, bike/row work and coach-led lifting remain the base.","companion":"Handled core-bag carry/pickup, checked front-rack clean option, cable rotation and incline pop push-ups, TRX hamstring option, stability-ball/ab-wheel progression, crawling, rope and dynamic footwork. Padded medicine ball is held only as an optional carry substitute.","progress":"New tools begin at a manageable technique dose. Familiar achieved exercises are not reset to beginner versions. The same family is trained for several weeks before changing it.","boundary":"No program can cover every possible vulnerability or promise readiness for hard contact. Technical classes replace workload; do not stack all disciplines, Olympic lifting and powerlifting at once."}]};
