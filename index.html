function showRules(){openSheet('Readiness + progression',`
<p><strong>The standard program assumes your previously achieved skills are still comfortable.</strong> It does not assume every injury has healed. Use Setup to select reduced load or stop when needed; a week number is not clearance.</p>
<div class="check-grid"><div class="check green">READY: normal walking/turning, no sharp pain, swelling or limp, controlled technique, and normal next-morning response.</div><div class="check yellow">REDUCE: increasing discomfort, altered technique, unusual fatigue or a worse next morning. Fewer familiar strength sets, no impact; do not keep testing the painful motion.</div><div class="check red">STOP: sharp knee jabs, locking, giving way, swelling, a limp, new numbness/weakness or radiating leg symptoms. Stop the provoking work and get assessed.</div></div>
<h3>The recent right-knee symptoms</h3><p>Your brief outer-knee jabs reached 6–7/10. Brief does not make them an acceptable training stimulus, and the older patellofemoral diagnosis does not establish their cause. If they persist, arrange an in-person examination before running, rope, jumps or sharp turns. Urgent help for inability to bear weight, a locked/markedly swollen knee, or a hot/red knee with fever. Emergency help for new bladder/bowel problems, saddle numbness or rapidly progressive leg weakness.</p>
<h3>How progression works</h3><p><strong>Strength:</strong> leave about 2–3 good repetitions in reserve. Fill the rep range at the current load, then increase load a little and return to the low end. <strong>Power:</strong> stop a set when takeoff, push-up speed or landing control deteriorates. Rest fully rather than chasing a burn. <strong>Skills:</strong> add a direction or cue without also adding load and volume. Complete two comfortable exposures and normal next mornings before moving up.</p>
<h3>Tendon capacity is loaded, not massaged</h3><p>Slow controlled calf/ankle and other resistance work provides sustained loading; rope and jumps add faster loading later in the sequence. These are different qualities. CastleFlexx, Hip Hook, Range, Orbit and massage do not replace that work. No claim is made that all your tendons need an identical protocol or that this prevents every injury.</p>
<h3>Ball and bag rules</h3><p>No throwing, slamming or dropping your padded medicine ball or handled core bag. Retain cable handles throughout rotations. Cable work trains retained-load strength/control, not the same free-release power as a throw. Jumps, pop push-ups and later coach-checked bag/KB options retain the athletic progression.</p><h3>One shared workload</h3><p>Friday jumps replace the existing box/step-up jump slot; the Friday cable-rotation slot stays counted once. Your pop push-ups move from Sunday to Tuesday before bench work. Sunday’s planned jumps, rope, crawls and bag work replace the old rabbits/jump-squat/core circuit. Do not add old doses on top. Count Friday and Sunday landings, rope active seconds, running minutes and classes separately; they are not interchangeable units.</p>
<h3>After both travel breaks</h3><p>First seven days: one easy familiar accessory set and no impact. Next seven days: low-end familiar work; reduced impact requires the separate return-readiness confirmation. Do not learn a new bag clean or longer wheel rollout during the return. These are conservative design choices, not a tested individual medical protocol. Coordinate Mike’s main lifts and jumps too.</p>
<h3>What is deliberately not included</h3><p>No head-loaded wrestling bridges, forced end-range neck stretching, maximal depth jumps, hard sparring, unsupervised throws, maximal ab-wheel extensions or technique-fatigued Olympic lifts. Sport-specific coaching and gradual contact exposure cannot be replaced by a gym circuit.</p>`);}

<h3>Weekly structure</h3><table><tr><th>Day</th><th>Role</th></tr><tr><td>Friday</td><td>Counted-once jumps and cable rotation; TrainWell back squat/main strength; soleus, hip abductors, Copenhagen and suitcase carry.</td></tr><tr><td>Saturday</td><td>Rest. No make-up workout.</td></tr><tr><td>Sunday</td><td>Full athletic replacement session: jumps, rope, crawls, core bag, footwork and easy run/walk. About 45–60 minutes total.</td></tr><tr><td>Monday</td><td>Mike’s rehabilitation/cardio. No added strength.</td></tr><tr><td>Tuesday</td><td>Shoulder prep and incline pop-push-up power; bench/main pulls/carries; rollout progression and moderate neck capacity.</td></tr><tr><td>Wednesday</td><td>Easy ankle, calf, hip-abductor and wrist capacity with one control/mobility drill.</td></tr><tr><td>Thursday</td><td>Mike’s recovery/rehabilitation work. No added strength.</td></tr></table>
<h3>What stays with Mike</h3><p>Tuesday bench 3 × 5, Friday squat 3 × 5, current rows/pulldowns, farmer and waiter carries, rowing/biking and the main exercise load prescriptions. The file does not have a live export of every current TrainWell set. The new power and accessory cards identify shared slots explicitly so you can reconcile them once with Mike.</p>
<h3>What makes this a progression</h3><p>Rope is scheduled visibly from the first block. Bear crawls and suitcase carries are present early. Your previous broad jumps and bounds remain the starting movement family. New handled-bag and wheel skills begin with small technique doses, then progress through range, resistance, direction, reaction and repeatability. Novelty does not automatically make an exercise better.</p>
${PH.map((p,i)=>`<div class="phase-card"><h3>Weeks ${i*4+1}–${i*4+4}: ${esc(p.name)}</h3><p>${esc(p.focus)}</p><p><b>Strength:</b> ${esc(p.strength)}</p><p><b>Athletic work:</b> ${esc(p.skill)}</p></div>`).join('')}

<h3>When the sports begin</h3><p>Boxing, kickboxing/Muay Thai, wrestling, judo and jujitsu require their own technique and contact progressions. Olympic lifting and powerlifting also need coach-owned loading. Start with a manageable schedule and replace work as classes increase. The class setting removes Sunday’s full block for one coached session and reduces accessories at two or more sessions; it does not make a seven-discipline weekly schedule automatically recoverable.</p>

function showLog(){if(viewPosition().kind!=='training'){openSheet('Nothing to log','<p>No companion workout is scheduled for this selected date. Travel is not a missed session.</p>');return;}let n=state.notes[dayKey()]||{};openSheet('Session + next-morning note',`<p>${esc(dateAt(state.week,state.day))} · Week ${state.week} · ${state.day}. Record what you actually did, not only the scheduled dose.</p><label for="noteLoad">Loads / repetitions / support / impact</label><textarea id="noteLoad" rows="3" placeholder="Hip band, step height, carry load, jump or rope dose; any main-session substitutions">${esc(n.load||'')}</textarea><label for="noteAfter">During / afterward</label><textarea id="noteAfter" rows="2" placeholder="Pain location, movement quality, fatigue, approximate total session time">${esc(n.after||'')}</textarea><label for="noteMorning">Next morning</label><textarea id="noteMorning" rows="2" placeholder="Back to baseline? Sharp pain, swelling, limp, altered walking or unusual fatigue?">${esc(n.morning||'')}</textarea><button class="close" onclick="saveLog()">Save note</button>`);}
function saveLog(){state.notes[dayKey()]={date:dateISO(state.week,state.day),load:$('noteLoad').value,after:$('noteAfter').value,morning:$('noteMorning').value};save();closeSheet();toast('Saved locally.');}
function showLibrary(){openSheet('All instructional videos',`<p>These are technique references, not extra exercises. Tap the exercise title on a card to watch; use its clipboard button to copy the exact name.</p><div class="video-index">${Object.values(EX).map(x=>`<div><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><strong>${esc(x.title)} ↗</strong></a><small>${esc(x.provider)} · ${x.url.includes('youtube.com')?'YouTube':x.url.includes('vimeo.com')?'Vimeo':'Public video page'}</small></div>`).join('')}</div>`);}
function exportBackup(){const blob=new Blob([JSON.stringify({version:FILE_VERSION,state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trainwell_combat_companion_backup_v5.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importBackup(input){try{let f=input.files[0];if(!f)return;let d=JSON.parse(await f.text());if(![1,2,3,4,5].includes(d.version)||!d.state||!DAYS.includes(d.state.day)||!Number.isInteger(d.state.week)||d.state.week<1||d.state.week>24)throw Error('invalid');state=normalise(d.state);calendarCache=null;save();closeSheet();render();toast('Backup restored; both travel pauses remain in place.');}catch(e){toast('That is not a valid companion backup.');}}
async function copyName(){let t=current()[state.idx].title;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}else throw Error('fallback');toast('Exercise name copied');}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:0;top:0;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(ok)toast('Exercise name copied');else{openSheet('Copy exercise name',`<p>Select and copy this name:</p><input id="manualCopy" value="${esc(t)}" readonly style="width:100%;padding:12px;font-size:17px">`);$('manualCopy').select();}}}
let timer=null,timerEnd=0;
function stopTimer(){clearInterval(timer);timer=null;$('timerOutput').textContent='';$('stopTimer').hidden=true;}
function startTimer(n){stopTimer();timerEnd=Date.now()+n*1000;$('stopTimer').hidden=false;function tick(){let left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));$('timerOutput').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left){clearInterval(timer);timer=null;toast('Timer finished');$('stopTimer').hidden=true;}}tick();timer=setInterval(tick,250);}
function goDate(s){if(!validDate(s)){toast('Choose a valid calendar date.');return;}let p=positionForDate(s);state.viewDate=s;state.idx=0;if(p.kind==='training'){state.week=p.week;state.day=p.day;}else if(p.kind==='pause'){const r=positionForDate(breakForDate(s).resume);if(r.kind==='training'){state.week=r.week;state.day=r.day;}}render();}
function goToday(){goDate(localISO());}
for(let i=1;i<=24;i++){let o=document.createElement('option');o.value=i;o.textContent='Week '+i+(i%4===0?' · lighter':'');$('weekSelect').append(o);}
DAYS.forEach(d=>{let o=document.createElement('option');o.value=d;o.textContent=d;$('daySelect').append(o);});
$('weekSelect').onchange=e=>{state.week=Number(e.target.value);state.idx=0;state.viewDate=null;render();};
$('daySelect').onchange=e=>{state.day=e.target.value;state.idx=0;state.viewDate=null;render();};
$('dateSelect').onchange=e=>goDate(e.target.value);
$('nextBtn').onclick=next;$('backBtn').onclick=previous;$('todayBtn').onclick=goToday;$('rulesBtn').onclick=showRules;$('planBtn').onclick=showPlan;$('settingsBtn').onclick=showSettings;$('overviewBtn').onclick=showOverview;$('libraryBtn').onclick=showLibrary;$('logBtn').onclick=showLog;$('copyBtn').onclick=copyName;$('stopTimer').onclick=stopTimer;$('coverageBtn').onclick=showCoverage;$('calendarBtn').onclick=showCalendar;
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>startTimer(Number(b.dataset.time)));
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeSheet();};
document.addEventListener('keydown',e=>{if($('overlay').classList.contains('open')){if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let a=[...$('sheet').querySelectorAll('a[href],button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!a.length)return;let first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(['SELECT','INPUT','TEXTAREA','BUTTON','A','SUMMARY'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'||e.key==='Enter')next();if(e.key==='ArrowLeft')previous();});
let touch=null;$('card').addEventListener('touchstart',e=>{if(e.target.closest('a,button,summary,details'))return;touch={x:e.changedTouches[0].screenX,y:e.changedTouches[0].screenY};},{passive:true});$('card').addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].screenX-touch.x,dy=e.changedTouches[0].screenY-touch.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?next():previous();}touch=null;},{passive:true});
window.companion={version:FILE_VERSION,breaks:BREAKS,dayPlan,current,exercises:EX,phases:PH,scheduledDates,dateISO,dateAt,weekRange,positionForDate,returnStage,goDate,goToday,showCalendar,showCoverage,getState:()=>JSON.parse(JSON.stringify(state)),setState:s=>{state=normalise({...state,...s});calendarCache=null;render();},render};
if(firstOpen||pausedDate(localISO()))goToday();else render();


function showProgression(){
 const rows=Array.from({length:24},(_,i)=>{let w=i+1,c=context(w,'Sunday'),p=phase(w),r=deload(w)?0:Math.min(within(w),2),a=ROPE[p],n=deload(w)?Math.max(2,Math.floor(a[0]/2)):r===0?a[0]:a[0]+(p===0?0:1),sec=deload(w)?a[1]:a[r+1];return `<tr><td><b>${w}${deload(w)?' · lighter':''}</b></td><td>${n} × ${sec} sec<br><small>${n*sec} sec active, rests extra</small></td><td>${p<3?'2:1 × 6 = 18 min':'2:1 × 3 = 9 min'}${deload(w)?'<br><small>lighter week: 9 min</small>':''}</td><td>${esc(PH[p].short)}</td></tr>`;}).join('');
 openSheet('Your 24-week progression',`<p><strong>Progress is more than adding exercises.</strong> Familiar jumps, bounds and crawling start in the first block. New equipment is learned at a low dose, then the same movement family gains load, range, speed or decision demand.</p><p>This table shows the planned mixed rope/run track before travel, readiness or class adjustments. The actual day card has the final dose. Hold your last comfortable level until two exposures and next mornings are normal; record that choice in your session note.</p>
 <div class="phase-table"><table><tr><th>Weeks</th><th>Power / movement</th><th>Loaded control / core</th><th>What changes</th></tr>
 <tr><td>1–4</td><td>Box jump; broad jump + lateral bound; standing cable rotation; incline pop push-ups; basic rope.</td><td>Bear crawl, bear-hug bag carry, stability-ball rollout, established lower/shoulder capacity.</td><td>Carry forward the last block. Learn new tools without adding a second full workout.</td></tr>
 <tr><td>5–8</td><td>Planned shuffle-stop; basic / alternating rope; familiar jumps.</td><td>Lateral crawl, short kneeling wheel, slow technical stand-up; stronger bag carry.</td><td>Add a direction and controlled lever length. No simultaneous jump in load and volume.</td></tr>
 <tr><td>9–12</td><td>Step-up jump in Friday’s shared slot; split-stance cable rotation; two-jump sequences.</td><td>Light bag pickup + carry; three-direction crawl; longer controlled wheel reach.</td><td>Link individual skills, retain low repetition power sets.</td></tr>
 <tr><td>13–16</td><td>Simple external-cue shuffle; rebound-to-stick; longer rope rounds.</td><td>Loaded pickup/carry control and repeatable trunk strength.</td><td>Decision-making and braking. March travel return temporarily overrides this dose.</td></tr>
 <tr><td>17–20</td><td>Repeat consistent pop push-ups/bounds; short athletic rounds.</td><td>Carry/crawl pairing; optional coach-checked handled front-rack clean OR kettlebell swing replaces bag slot.</td><td>Repeat force with rest, not an all-out circuit.</td></tr>
 <tr><td>21–24</td><td>Longer coordinated rope/footwork and consistent directional work.</td><td>Maintain strength while classes replace conditioning. Review submaximal benchmarks.</td><td>More useful work at the same technique and recovery cost. Not a sparring or competition clearance.</td></tr></table></div>
 <h3>Exact planned Sunday intervals</h3><div class="table-scroll"><table><tr><th>Week</th><th>Rope</th><th>Jog : walk</th><th>Block</th></tr>${rows}</table></div>
 <h3>Strength progression</h3><p>Friday soleus usually 2 sets of 8 → 10 → 12; later third sets are limited to the third loading week. Side-lying hip abduction 10 → 12 → 15. Copenhagen 20 → 25 → 30 seconds at the achieved lever. Suitcase distance 25 → 30 → 35 m per side. After filling a range with 2–3 repetitions in reserve and two calm exposures, add the smallest resistance increment and return to the lower range. The four-week pattern repeats at the new capacity; it is not the same load forever.</p>
 <h3>Measures that matter</h3><p>Track comfortable load, reach distance, clean rope time, consistent landing and push-up quality, bag carry distance, posture under fatigue and next-morning response. No single drill or test establishes readiness for every combat sport. If Mike increases squat/bench load or a sport class is added, hold companion progression that week.</p>`);
}
function showRecovery(){openSheet('Equipment roles + optional recovery',`
<p><strong>The training equipment develops capacity. Release tools are optional comfort.</strong> Owning a tool is not a reason to add another compulsory task.</p>
<table><tr><th>Equipment</th><th>Role in this program</th></tr><tr><td>Padded medicine ball</td><td>Held-load use only. An optional bear-hug carry replaces, rather than adds to, the bag carry. No throws, chest passes, catches, wall impacts, bouncing, slams or drops. Your specific equipment restriction overrides generic wall-ball demonstrations.</td></tr><tr><td>Cable station + stable bench</td><td>The existing Friday rotation slot supplies controlled rotational strength. A brief Tuesday incline pop-push-up slot preserves upper-body explosive work without throwing the ball. These are not identical substitutes for free-release throws.</td></tr><tr><td>Handled core bag</td><td>Use sound handles for controlled pickup; hug the bag body for carries. Later, only after coaching, a two-hand clean to front rack may replace the carry. No shoulder toss, release, slam or drop. Follow the DO NOT SLAM label; never treat this as a slam bag.</td></tr><tr><td>Stability ball / ab wheel</td><td>Progressive resistance to back extension during rollouts. The large inflatable stability ball is separate from the padded weighted medicine ball; do not use the weighted ball for rollout support.</td></tr><tr><td>TRX</td><td>Hamstring-curl alternative in an existing accessory slot; low-row alternative in an existing pulling slot.</td></tr><tr><td>Jump rope</td><td>Visible weekly rhythm, low-amplitude repeated contacts and conditioning progression.</td></tr><tr><td>Bands, dumbbells, kettlebells</td><td>Hip/ankle/cuff/neck support, progressive carries and selected strength work. Swing is an optional later coached replacement.</td></tr><tr><td>Row / bike / elliptical / StairMaster</td><td>Mike owns existing cardio. Bike is the companion fallback. No need to add every machine; stairs can be provocative to knee/forefoot.</td></tr><tr><td>Slant board</td><td>Not compulsory. A specialized knee-loading variation only after a clear reason and assessment; flat step-downs remain the control drill.</td></tr></table>
<h3>Hip Hook, Range and Orbit</h3><p>Use only the official demonstrated positions and your healthcare practitioner’s guidance. These tools are not counted as tendon, glute or neck-strength work. Skip painful pressure and stop for tingling, numbness, throbbing or radiating symptoms. Do not improvise deep pressure into the groin, abdomen or front/side of the neck.</p><p><a href="https://alethahealth.com/pages/howto" target="_blank" rel="noopener noreferrer">Official free instructions and video library ↗</a> · <a href="https://alethahealth.com/pages/safety-terms-of-use" target="_blank" rel="noopener noreferrer">Product safety guidance ↗</a></p>
<h3>Small ball and arches</h3><p>A soft ball under a non-painful mid-arch while seated can be an optional light comfort technique. Do not grind a hard golf ball into the sesamoids, navicular area, bruising or a painful tendon. It is not a strengthening progression. Active short-foot, calf/ankle resistance and gradually tolerated impact are the training work.</p>
<h3>CastleFlexx and massage gun</h3><p>Use familiar gentle ranges and comfortable muscle-belly pressure only. No forced great-toe extension or work directly over bone, joints, nerves or the spine. One comfort tool is enough; normal rest without any tool is also a complete recovery day. No tools are scheduled during travel blackouts.</p>`);}
